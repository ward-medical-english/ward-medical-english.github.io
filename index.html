<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARD — Medical English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: editorial fashion house — quiet, confident, monochrome, lots of air
   IDEA: a seasonal lookbook / storefront where the "collection" is the ward round of medical English
   PICTURE: giant WARD wordmark with a stethoscope drawn through it, like a model stepping through the logo
   COLOUR and TYPE: espresso ink, warm stone-beige ground, deep espresso bands, pale butter only for correct answers; Jost + Noto Sans KR light
   LAYOUT: announce strip, nav, hero, dark three-column band, season band, service row, unit grid like a product grid, footer */
:root{color-scheme:light dark;
--bg:light-dark(#ebe5dc,#16100c);--paper:light-dark(#f4f0ea,#1f1712);--ink:light-dark(#241710,#efe7da);
--mute:light-dark(#7d6f63,#a8978a);--hair:light-dark(#cfc5b8,#3d2f26);--band:#1e140e;--bandink:#efe7da;
--butter:light-dark(#efe2a6,#4a3e1c);--terra:#b5583f;--terra2:light-dark(#efd7cd,#43231a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 "Jost","Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.cap{font-family:"Jost",sans-serif;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.kr{font-family:"Noto Sans KR",sans-serif}
.strip{background:var(--band);color:var(--bandink);display:flex;justify-content:space-between;gap:12px;padding:7px max(3vw,14px);flex-wrap:wrap}
.strip span{font-size:10px}
.nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(3vw,14px);background:var(--bg);border-bottom:1px solid var(--hair)}
.nav .l,.nav .r{display:flex;gap:clamp(12px,2vw,26px);flex-wrap:wrap}
.nav .r{justify-content:flex-end;align-items:center;flex-wrap:nowrap}
@media (max-width:1000px){.nav .r>.hide{display:none}}
.nav button{text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:500}
.nav a,.nav button{text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.logo{font-family:"Jost";font-weight:500;font-size:26px;letter-spacing:.06em;cursor:pointer}
.sec{padding:clamp(40px,6vw,88px) max(3vw,14px)}
.inner{max-width:1240px;margin:0 auto}
/* hero */
.hero{position:relative;padding-top:clamp(28px,4vw,52px);padding-bottom:clamp(28px,4vw,48px)}
.tagline{line-height:2;margin:0 0 6px}
.tagline::after{content:"";display:block;width:26px;border-top:1px solid var(--ink);margin-top:6px}
.wordwrap{position:relative;margin:clamp(10px,2vw,24px) 0}
.word{font-family:"Jost";font-weight:500;font-size:clamp(110px,27vw,360px);line-height:.82;letter-spacing:-.02em;text-align:center;margin:0}
.steth{position:absolute;left:50%;top:-14%;height:132%;transform:translateX(-46%);pointer-events:none;filter:drop-shadow(0 18px 18px rgba(36,23,16,.18))}
.herorow{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:clamp(20px,3vw,36px)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 26px;background:var(--ink);color:var(--bg);font:500 11px "Jost";letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.ulink{font:500 11px "Jost";letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid currentColor;padding:4px 0;min-height:32px}
.side{text-align:right;line-height:2}
.side::after{content:"";display:block;width:26px;border-top:1px solid var(--ink);margin:6px 0 0 auto}
/* dark band */
.band{background:var(--band);color:var(--bandink)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,40px)}
.cell{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:center}
.thumb{aspect-ratio:3/4;background:#2c1f17;display:grid;place-items:center;font-family:"Jost";font-weight:400;font-size:34px;color:#efe7da;position:relative;overflow:hidden}
.thumb small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:#a8978a}
.thumb .fill{position:absolute;left:0;bottom:0;width:100%;background:#4a3a2c;z-index:0}
.thumb>span{position:relative;z-index:1}
.cell h3{font:500 15px "Jost";letter-spacing:.18em;margin:0 0 4px;text-transform:uppercase}
.cell p{margin:0 0 10px;font-size:13px;color:#cbbcad;font-family:"Noto Sans KR";font-weight:300}
.cell .ulink{color:var(--bandink)}
.dots{display:flex;gap:5px;margin:0 0 10px}
.dots i{width:12px;height:12px;border:1px solid #8b7a6b}
.dots i.on{background:#efe2a6;border-color:#efe2a6}
.dots i.now{outline:1px solid #efe7da;outline-offset:2px}
.goal{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:10px;color:#a8978a}
.goal button{font:500 11px "Jost";color:#cbbcad;min-height:30px;min-width:26px;letter-spacing:.1em}
.goal button.sel{color:#efe7da;border-bottom:1px solid #efe7da}
.btn.inv{background:#efe7da;color:#1e140e;border-color:#efe7da}
.btn.invg{background:transparent;color:#efe7da;border-color:#8b7a6b}
.btn.lg{min-height:56px;padding:0 34px;font-size:12px}
.act{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:stretch}
.act .main h2{font:500 clamp(34px,4.6vw,58px)/1 "Jost";letter-spacing:-.01em;margin:10px 0 10px;text-transform:uppercase;color:#efe7da}
.act .main p{font:300 14px "Noto Sans KR";color:#cbbcad;margin:0 0 22px}
.act .main .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.meter{height:2px;background:#4a3a2c;margin:0 0 22px;position:relative;max-width:420px}
.meter i{position:absolute;left:0;top:-1px;height:4px;background:#efe2a6}
.act .side2{border-left:1px solid #3d2f26;padding-left:clamp(16px,2.5vw,36px);display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.act .side2 .n{font:400 clamp(48px,6vw,80px)/1 "Jost";color:#efe7da}
.navgo{background:var(--ink);color:var(--bg)!important;padding:0 14px}
.who{border-bottom:1px solid currentColor;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* who's playing / welcome */
.gate{min-height:100vh;min-height:100dvh;background:var(--band);color:var(--bandink);display:grid;place-items:center;padding:32px 16px}
.gin{width:min(460px,100%)}
.glogo{font:500 15px "Jost";letter-spacing:.6em;margin:0 0 clamp(28px,7vh,56px)}
.gin h1{font:300 clamp(40px,10vw,68px)/1.02 "Jost","Noto Sans KR";letter-spacing:-.01em;margin:0 0 30px}
.gin input{width:100%;font:300 24px "Jost","Noto Sans KR";padding:12px 0;border:0;border-bottom:1px solid #8b7a6b;background:transparent;color:#efe7da;border-radius:0}
.gin input::placeholder{color:#7d6f63}.gin input:focus{outline:0;border-bottom-color:#efe2a6}
.gin .err{color:#e59b84;font-size:13px;min-height:1.3em;margin:10px 0 14px}
.gin .btn{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid #5c4a3d;padding:9px 16px;font:400 15px "Jost","Noto Sans KR"}
.chips button.last{border-color:#efe2a6}.chips button:hover{background:#2c1f17}
.gin .note{color:#a8978a;font-size:13px;line-height:1.7;margin:28px 0 0}
.welcome h1 span{color:#efe2a6}
.welcome h1,.welcome .cap{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.welcome .cap{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* dashboard */
.dash{text-align:center;padding-block:clamp(26px,5vw,60px)}
.dash .hi{color:#a8978a;margin:0 0 14px}.dash .syncst{margin-left:10px;color:#7d6f63}
.dash .stk{font:300 clamp(28px,4.6vw,42px)/1.1 "Jost";margin:0}.dash .stk b{font-weight:500;color:#efe2a6}
.ringw{position:relative;width:min(250px,64vw);aspect-ratio:1;margin:clamp(18px,3vw,30px) auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:7}.ringw .trk{stroke:#3d2f26}
.ringw .val{stroke:#efe2a6;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ringw .mid{position:absolute;inset:0;display:grid;place-content:center;gap:6px}
.ringw .pct{font:300 clamp(54px,12vw,76px)/1 "Jost"}.ringw .pct small{font-size:.38em;margin-left:2px}
.ringw .mid .cap{color:#a8978a;font-size:10px}
.dash .go{width:min(360px,100%)}
.dash .sub{color:#a8978a;font-size:13px;margin:14px 0 6px}
.dash .ulink{color:#cbbcad}
@media (prefers-reduced-motion:reduce){.welcome h1,.welcome .cap{animation:none}.ringw .val{transition:none}}
/* season */
.season{background:var(--paper);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;gap:30px}
.season h2{font:500 clamp(44px,6vw,76px)/.95 "Jost";letter-spacing:-.01em;margin:10px 0 14px;text-transform:uppercase}
.season p{font-family:"Noto Sans KR";font-size:14px;margin:0 0 22px;max-width:30ch}
.ecg{width:100%;height:clamp(140px,18vw,240px)}
/* services */
.serv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-bottom:1px solid var(--hair)}
.serv>div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.serv svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.3}
.serv b{display:block}
.serv span{font-size:12px;color:var(--mute);font-family:"Noto Sans KR"}
/* unit grid */
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.head h2{font:500 18px "Jost";letter-spacing:.14em;text-transform:uppercase;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.tile{background:var(--paper);aspect-ratio:5/4;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;cursor:pointer;border:1px solid transparent;transition:border-color .2s}
.tile:hover{border-color:var(--ink)}
.tile .num{font:400 clamp(56px,7vw,96px)/1 "Jost";letter-spacing:-.03em}
.tile .sys{font-size:10px;padding-right:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .prog{height:1px;background:var(--hair);position:relative}
.tile .prog i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.heart{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.heart svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.5}
.uinfo{padding:12px 0 4px}
.uinfo h3{font:400 15px "Noto Sans KR";margin:0}
.uinfo .meta{font-size:12px;color:var(--mute)}
.ls{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.ls button{font:500 11px "Jost";letter-spacing:.14em;min-height:32px;color:var(--mute);border-bottom:1px solid transparent}
.ls button.done{color:var(--ink);border-bottom-color:var(--ink)}
.ls button:hover{color:var(--ink)}
/* rules + exam */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,64px)}
.rule{border-top:1px solid var(--hair);padding:14px 0;font-family:"Noto Sans KR";font-size:14px}
.rule b{font-family:"Jost";font-weight:500;letter-spacing:.12em;font-size:12px}
.rule .ex{font-size:13px;color:var(--mute)}
.bad{text-decoration:line-through;color:var(--terra)}
table{border-collapse:collapse;width:100%;font-size:13px;font-family:"Noto Sans KR"}
td,th{border-top:1px solid var(--hair);padding:10px 6px 10px 0;text-align:left;vertical-align:top;font-weight:300}
th{font:500 10px "Jost";letter-spacing:.2em;text-transform:uppercase}
.foot2{background:var(--band);color:var(--bandink)}
.foot2 .big{font:500 clamp(60px,12vw,150px)/.85 "Jost";letter-spacing:-.02em;margin:0 0 20px}
.foot2 p{font-size:12px;color:#a8978a;font-family:"Noto Sans KR";max-width:70ch}
/* lesson */
.lwrap{max-width:820px;margin:0 auto;padding:28px max(4vw,16px) 150px}
.lhead{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.bar{height:1px;background:var(--hair);flex:1;position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);transition:width .3s}
.ltag{margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;color:var(--mute)}
.ltag .cap:first-child{color:var(--ink)}
.q{font:400 clamp(19px,2.4vw,24px)/1.5 "Jost","Noto Sans KR";margin:0 0 26px}
.q u{text-decoration-thickness:1px;text-underline-offset:5px}
.q{white-space:pre-line}.q .box{border:1px solid var(--ink);padding:0 6px;margin:0 2px;font-weight:500;white-space:nowrap}
.q mark{background:var(--butter);color:var(--ink);padding:0 4px;font-weight:500;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.instr{margin:0 0 18px;padding:2px 0 2px 14px;border-left:2px solid var(--ink)}
.instr b{display:block;font:500 clamp(16px,1.9vw,19px)/1.4 "Jost";letter-spacing:0}
.instr span{display:block;font:400 13px "Noto Sans KR";color:var(--mute);margin-top:2px}
.q sup{font-size:10px;font-weight:600;margin-right:2px;letter-spacing:.05em}
.opts{border-bottom:1px solid var(--hair)}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr);width:100%;text-align:left;border-top:1px solid var(--hair);padding:15px 8px;min-height:56px;font:400 17px "Jost","Noto Sans KR";transition:background .15s}
.opt:hover{background:var(--paper)}
.opt b{font:500 11px "Jost";letter-spacing:.2em;color:var(--mute);padding-top:5px}
.opt.sel{background:var(--paper);box-shadow:inset 3px 0 0 var(--ink)}
.opt.ok{background:var(--butter);box-shadow:inset 3px 0 0 var(--ink)}
.opt.no{background:var(--terra2);box-shadow:inset 3px 0 0 var(--terra)}
.play{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.passage{background:var(--paper);padding:18px 20px;margin-bottom:20px;line-height:1.8;font-weight:400}
.gap{font-size:17px;line-height:2.5;font-weight:400}
.gap b{font:500 11px "Jost";letter-spacing:.1em}
.gap input{width:9em;font:400 16px "Jost";padding:2px 4px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink)}
.gap input.ok{background:var(--butter)}.gap input.no{background:var(--terra2);border-color:var(--terra)}
.tf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--hair);font-weight:400}
.seg{display:flex}
.seg button{min-width:70px;min-height:42px;border:1px solid var(--ink);font:500 10px "Jost";letter-spacing:.2em;text-transform:uppercase}
.seg button+button{border-left:0}
.seg button.sel{background:var(--ink);color:var(--bg)}
.seg button.ok{background:var(--butter);color:var(--ink)}.seg button.no{background:var(--terra2);color:var(--ink)}
textarea{width:100%;min-height:100px;font:400 16px "Jost","Noto Sans KR";padding:12px;border:1px solid var(--hair);background:var(--paper);color:var(--ink)}
.model{background:var(--butter);padding:12px 16px;margin:10px 0 18px;font-size:15px;font-weight:400}
.tmr{background:var(--paper);padding:18px 20px;margin:0 0 14px;transition:background .3s}
.tmr .tn{font:300 clamp(46px,9vw,68px)/1 "Jost";font-variant-numeric:tabular-nums}
.tmr #tl{color:var(--mute);margin-top:6px}
.tbar{height:2px;background:var(--hair);margin-top:14px;position:relative}.tbar i{position:absolute;left:0;top:-1px;height:4px;width:0;background:var(--mute)}
.tmr.speak .tbar i{background:var(--ink)}.tmr.up{background:var(--terra2)}.tmr.up .tbar i{background:var(--terra)}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#aud{width:100%;margin-bottom:14px}
.fu{border-top:1px solid var(--hair);padding:12px 0}.fu summary{cursor:pointer;font-weight:500;line-height:1.6}.fu summary .ulink{margin-left:8px;min-height:0;padding:0}.fu p{margin:8px 0 0;font-weight:400}
.ph{background:var(--butter);padding:0 3px}
.asr{border-top:1px solid var(--hair);margin-top:18px;padding-top:16px}
.verdict{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:14px 16px;margin:16px 0 10px}.verdict.ok{background:var(--butter)}.verdict.no{background:var(--terra2)}
.verdict b{font:300 28px "Jost"}.verdict .kr{font-size:14px;flex-basis:100%}
.atab{width:100%;border-collapse:collapse;font-size:14px}.atab td{border-top:1px solid var(--hair);padding:10px 6px;vertical-align:top}.atab td:first-child{width:28%}
.dots5{white-space:nowrap;letter-spacing:2px;font-size:12px}
.gflag{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--hair)}
.kwd{display:inline-block;border:1px solid var(--ink);padding:6px 16px;margin:0 0 14px;font-size:14px;font-weight:500;letter-spacing:.2em}
.gap input.kwi{width:min(16em,60vw)}
.pts{margin:0 0 16px;padding-left:20px;line-height:1.9}
.chk{display:grid;gap:8px;margin-bottom:6px}.chk label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}.chk input{margin-top:5px;accent-color:var(--ink)}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.kw span{border:1px solid var(--hair);padding:3px 10px;font-size:13px}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:16px max(4vw,16px) calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ink)}
.footbar.ok{background:var(--butter)}.footbar.no{background:var(--terra2)}
.footbar .in{max-width:820px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb{flex:1;min-width:220px;font-size:14px;font-family:"Noto Sans KR";font-weight:400}
.fb strong{display:block;font:500 12px "Jost";letter-spacing:.22em;text-transform:uppercase;margin-bottom:4px}
.card{perspective:1200px;margin:10px 0 24px}
.flip{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--band);color:var(--bandink)}
.face .t{font:400 clamp(28px,5vw,44px)/1.1 "Jost","Noto Sans KR";letter-spacing:-.01em}
.end{text-align:center;padding-top:30px}
.end .num{font:400 clamp(90px,16vw,160px)/.9 "Jost";letter-spacing:-.03em}
.end h2{font:500 22px "Jost";letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px}
.sub{color:var(--mute);font-size:14px;font-family:"Noto Sans KR";margin:0 0 24px}
.missed{text-align:left;border-top:1px solid var(--hair);margin:10px 0 26px}
.missed div{border-bottom:1px solid var(--hair);padding:10px 0;font-size:14px;font-family:"Noto Sans KR"}
@media(max-width:900px){.act{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.act .main{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.serv{grid-template-columns:repeat(2,minmax(0,1fr))}.trio{grid-template-columns:minmax(0,1fr)}.cell{grid-template-columns:90px minmax(0,1fr)}}
@media(max-width:600px){.act .side2{border-left:0;padding-left:0;border-top:1px solid #3d2f26;padding-top:14px}.nav .r span{display:none}.nav{grid-template-columns:auto 1fr}.nav .l{display:none}.nav .r{gap:12px}.logo{font-size:22px}.season{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}.steth{height:128%}.herorow{flex-direction:column;align-items:flex-start}.side{text-align:left}.side::after{margin-left:0}.tf{grid-template-columns:minmax(0,1fr)}.strip .hide{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.flip,.bar i,.tile{transition:none}}
</style>

: "abdominopelvic cavity", "ko": "복골반강", "lay": "belly and pelvis space", "example": "The abdominopelvic cavity holds the organs of digestion."}, {"term": "thorax", "ko": "흉부", "lay": "chest", "example": "Do you feel any pain in your thorax?"}, {"term": "superior / inferior", "ko": "위쪽 / 아래쪽", "lay": "above / below", "example": "The head is superior to the neck."}, {"term": "anterior / posterior", "ko": "앞쪽 / 뒤쪽", "lay": "front / back", "example": "The sternum is anterior to the heart."}], "exercises": [{"type": "mcq", "q": "The thoracic cavity is separated from the abdominopelvic cavity by the ______.", "options": ["diaphragm", "pericardium", "pleura", "peritoneum"], "answer": 0, "explain_ko": "흉강과 복골반강의 경계는 횡격막(diaphragm). pleura는 폐 막, peritoneum은 복막."}, {"type": "mcq", "q": "The abdominal wall is ______ several layers of muscle, fat, connective tissue and skin.", "options": ["consists", "composed", "made up of", "comprises of"], "answer": 2, "explain_ko": "be동사 뒤 → made up of. consist of / be composed of / comprise(of 없음) 구분 [g1]."}, {"type": "mcq", "q": "The brain is protected inside the ______ cavity.", "options": ["thoracic", "cranial", "pelvic", "abdominal"], "answer": 1, "explain_ko": "cranial = 두개(skull)."}, {"type": "mcq", "q": "Which organ is NOT found in the abdominopelvic cavity?", "options": ["stomach", "liver", "lungs", "bladder"], "answer": 2, "explain_ko": "폐는 흉강(thoracic cavity)."}, {"type": "synonym", "sentence": "The heart [[is situated]] between the two lungs.", "options": ["is located", "is called", "is bounded", "is known"], "answer": 0, "explain_ko": "situated = located = lies [g2]."}, {"type": "synonym", "sentence": "Does the pain spread to your [[thorax]]?", "options": ["waist", "chest", "thigh", "forehead"], "answer": 1, "explain_ko": "thorax = chest."}, {"type": "error", "sentence": "Many of the organs (A)lying in the abdominal cavity (B)is covered by the peritoneum, a thin membrane (C)that produces fluid (D)to reduce friction.", "options": ["lying", "is covered", "that", "to reduce"], "answer": 1, "fix": "are covered", "explain_ko": "부분표현 Many of + 복수명사 → 복수동사 are. lying은 능동 분사 후치수식, to reduce는 목적의 to부정사로 맞음."}, {"type": "error", "sentence": "The mediastinum is the central part of the thoracic cavity (A)where the heart and the trachea (B)are located. It is also the region (C)where surgeons must open (D)in order to reach the heart during bypass surgery.", "options": ["where", "are located", "where", "in order to"], "answer": 2, "fix": "which (또는 that)", "explain_ko": "(C) 뒤 절에 open의 목적어가 빠진 불완전한 절 → 관계대명사 which. (A) where 뒤는 완전한 절이라 맞음. 관계부사/관계대명사 구분은 수능 단골."}, {"type": "listen_gap", "script": "The human body has two main cavities: the dorsal cavity and the ventral cavity. The dorsal cavity includes the cranial cavity, which contains the brain, and the spinal cavity, which contains the spinal cord. The ventral cavity is divided by a dome-shaped muscle called the diaphragm. Above it lies the thoracic cavity, which contains the heart and lungs. Below it is the abdominopelvic cavity, which holds the organs of digestion, the bladder and the reproductive organs.", "gap_text": "The dorsal cavity includes the ___(1)___ cavity, which contains the brain, and the spinal cavity, which contains the spinal ___(2)___. The ventral cavity is divided by a dome-shaped ___(3)___ called the diaphragm. The abdominopelvic cavity holds the organs of ___(4)___.", "answers": ["cranial", "cord", "muscle", "digestion"]}, {"type": "reading", "passage": "The body contains several spaces, or cavities, that hold and protect the internal organs. The cranial cavity is located in the skull and contains the brain. The thoracic cavity lies in the chest and is protected by the rib cage. It contains the heart, the lungs, the trachea and the oesophagus. The thoracic cavity is separated from the abdominopelvic cavity by the diaphragm, the main muscle of breathing. The upper part, the abdominal cavity, contains most of the organs of digestion, such as the stomach, liver and intestines. The lower part, the pelvic cavity, contains the bladder and the reproductive organs.", "questions": [{"q": "Where is the cranial cavity located, and what does it contain?", "model": "The cranial cavity is located in the skull, and it contains the brain."}, {"q": "What protects the thoracic cavity?", "model": "The rib cage protects the thoracic cavity."}, {"q": "What separates the thoracic cavity from the abdominopelvic cavity?", "model": "The diaphragm, the main muscle of breathing, separates them."}]}, {"type": "mcq", "q": "The ______ cavity lies below the diaphragm.", "options": ["abdominopelvic", "thoracic", "cranial", "pleural"], "answer": 0, "explain_ko": "횡격막 아래 = 복골반강."}, {"type": "mcq", "q": "The pleura is a double membrane (A)[that / what] surrounds each lung. The small amount of fluid between its two layers (B)[allow / allows] the lungs to move smoothly, and inflammation of the pleura, (C)[calling / called] pleurisy, causes sharp chest pain on breathing.", "options": ["what – allows – called", "that – allow – called", "that – allows – called", "that – allows – calling"], "answer": 2, "explain_ko": "(A) 선행사 a double membrane 있음 → that (what은 선행사 포함). (B) 주어는 The small amount(단수) → allows. (C) pleurisy라고 '불리는' → 과거분사 called."}, {"type": "mcq", "q": "The abdomen is often divided into nine regions, (A)[that / which] helps doctors describe the location of pain precisely. For example, pain (B)[felt / feeling] in the right iliac region may suggest appendicitis, (C)[whereas / despite] pain in the epigastric region often comes from the stomach.", "options": ["that – felt – whereas", "which – feeling – whereas", "which – felt – despite", "which – felt – whereas"], "answer": 3, "explain_ko": "(A) 콤마 뒤 계속적 용법 → which (that 불가). (B) 통증이 '느껴지는' → felt. (C) 뒤에 절(S+V) → 접속사 whereas (despite는 전치사)."}, {"type": "mcq", "q": "Patient: I've got a pain right here, under my ribs on the right side.\nDoctor: ______\nPatient: Yes, it goes round to my back, especially after fatty meals.", "options": ["Have you had a fever recently?", "Does the pain spread anywhere else?", "Is the pain worse when you cough?", "When did you last eat?"], "answer": 1, "explain_ko": "\"Yes, it goes round to my back\" → 방사통을 묻는 질문. spread/radiate. (우상복부 + 기름진 식사 후 → 담도산통 패턴)"}, {"type": "mcq", "q": "The vertebral column is ______ to the sternum.", "options": ["anterior", "posterior", "superior", "medial"], "answer": 1, "explain_ko": "척추는 흉골 뒤 → posterior."}, {"type": "mcq", "q": "The ______ plane divides the body into right and left parts.", "options": ["sagittal", "frontal", "transverse", "horizontal"], "answer": 0, "explain_ko": "좌우 = sagittal, 앞뒤 = frontal(coronal), 상하 = transverse."}, {"type": "mcq", "q": "A ______ plane divides the body into upper and lower parts.", "options": ["transverse", "sagittal", "frontal", "coronal"], "answer": 0, "explain_ko": "상하 분할 = transverse(horizontal)."}, {"type": "mcq", "q": "The ______ cavity contains the spinal cord.", "options": ["cranial", "vertebral", "thoracic", "pelvic"], "answer": 1, "explain_ko": "척수 = vertebral(spinal) cavity."}, {"type": "mcq", "q": "The abdominal cavity is lined by a membrane called the ______.", "options": ["pleura", "pericardium", "peritoneum", "meninges"], "answer": 2, "explain_ko": "복막 = peritoneum."}, {"type": "mcq", "q": "Each lung is surrounded by a membrane called the ______.", "options": ["pleura", "peritoneum", "pericardium", "dura mater"], "answer": 0, "explain_ko": "흉막 = pleura."}, {"type": "mcq", "q": "The kidneys lie in a ______ position, behind the peritoneum.", "options": ["retroperitoneum", "retroperitoneal", "retroperitoneally", "peritonitis"], "answer": 1, "explain_ko": "명사 position을 수식 → 형용사 retroperitoneal. retro- = 뒤, -al = 형용사 접미사."}, {"type": "synonym", "sentence": "The spleen lies [[adjacent to]] the stomach.", "options": ["far from", "next to", "inside", "above"], "answer": 1, "explain_ko": "adjacent to = next to (인접한)."}, {"type": "synonym", "sentence": "The wound was [[superficial]], so it did not reach the deeper tissues.", "options": ["very deep", "infected", "painless", "near the surface"], "answer": 3, "explain_ko": "superficial = 표재성, 표면 가까운 (↔ deep)."}, {"type": "synonym", "sentence": "The contents of the abdominal cavity [[include]] the main organs of digestion.", "options": ["provide", "protect", "support", "contain"], "answer": 3, "explain_ko": "include = contain."}, {"type": "synonym", "sentence": "Please point to the [[lateral]] side of your knee.", "options": ["middle", "outer", "front", "back"], "answer": 1, "explain_ko": "lateral = 정중선에서 먼 바깥쪽."}, {"type": "synonym", "sentence": "The pain is in the [[epigastric]] region.", "options": ["upper middle abdomen", "lower back", "chest wall", "groin"], "answer": 0, "explain_ko": "epi-(위) + gastric(위장) = 명치."}, {"type": "error", "sentence": "Not only (A)does the diaphragm separate the thoracic cavity from the abdominal cavity, but it also (B)plays a key role in breathing. When it (C)contracts, the chest cavity becomes larger, (D)caused air to flow into the lungs.", "options": ["does", "plays", "contracts", "caused"], "answer": 3, "fix": "causing", "explain_ko": "앞 절 전체가 원인이 되어 '공기를 흐르게 하는' 능동 → 분사구문 causing. Not only 문두 → 조동사 does 도치는 맞음."}, {"type": "error", "sentence": "The rib cage keeps the heart and lungs (A)safely from injury, (B)while still allowing the chest (C)to expand during each breath (D)that we take.", "options": ["safely", "while", "to expand", "that"], "answer": 0, "fix": "safe", "explain_ko": "keep + 목적어 + 형용사 보어 → safe (부사 safely 불가). allow + O + to V는 맞음."}, {"type": "error", "sentence": "The liver, (A)that is the largest internal organ, (B)lies in the upper right (C)part of the abdominal (D)cavity.", "options": ["that", "lies", "part", "cavity"], "answer": 0, "fix": "which", "explain_ko": "콤마 뒤 that 불가 → which [g4]."}, {"type": "error", "sentence": "The lungs (A)are (B)located (C)in either side (D)of the heart.", "options": ["are", "located", "in", "of"], "answer": 2, "fix": "on", "explain_ko": "on either side [g6]."}, {"type": "error", "sentence": "By the time the patient (A)arrived at the emergency department, blood (B)has already collected in his abdominal cavity, (C)which made his abdomen (D)swollen and tender.", "options": ["arrived", "has already collected", "which", "swollen"], "answer": 1, "fix": "had already collected", "explain_ko": "By the time + 과거 → 그 이전에 완료된 일은 과거완료 had p.p. make + O + 형용사(swollen) 맞음."}]}, {"id": "u2", "title": "Integumentary System (Skin)", "title_ko": "피부계", "vocab": [{"term": "epidermis", "ko": "표피", "lay": "outer layer of skin", "example": "Keratin is found in the top layers of the epidermis."}, {"term": "dermis", "ko": "진피", "lay": "middle layer of skin", "example": "The dermis contains blood vessels, nerves and glands."}, {"term": "hypodermis (subcutaneous tissue)", "ko": "피하조직", "lay": "fat layer under the skin", "example": "Beneath the dermis lies the hypodermis."}, {"term": "sebaceous gland", "ko": "피지선", "lay": "oil gland", "example": "Sebaceous glands keep the skin and hair soft."}, {"term": "sudoriferous gland", "ko": "땀샘", "lay": "sweat gland", "example": "Sweat glands help to regulate body temperature."}, {"term": "keratin", "ko": "케라틴", "lay": "tough skin protein", "example": "Keratin makes the skin tough and waterproof."}, {"term": "melanoma", "ko": "흑색종", "lay": "most dangerous skin cancer", "example": "Melanoma may develop from a mole."}, {"term": "basal-cell / squamous-cell carcinoma", "ko": "기저세포암 / 편평세포암", "lay": "non-melanoma skin cancers", "example": "Basal-cell carcinoma rarely spreads."}, {"term": "biopsy", "ko": "생검", "lay": "taking a tissue sample", "example": "Diagnosis is confirmed by biopsy."}, {"term": "atopic dermatitis (atopic eczema)", "ko": "아토피 피부염", "lay": "itchy, dry skin condition", "example": "Atopic eczema often starts before the first birthday."}, {"term": "flare-up", "ko": "악화기", "lay": "period when symptoms get worse", "example": "Stress can trigger a flare-up."}, {"term": "trichomycosis / onychia", "ko": "모발진균증 / 조갑염", "lay": "hair fungal infection / nail-bed inflammation", "example": "A fungal infection of the hair is called trichomycosis."}], "exercises": [{"type": "mcq", "q": "Blood vessels are found in the ______ and ______, but not in the ______.", "options": ["dermis / hypodermis / epidermis", "epidermis / dermis / hypodermis", "epidermis / hypodermis / dermis", "hypodermis / epidermis / dermis"], "answer": 0, "explain_ko": "표피(epidermis)는 무혈관층. 영양은 진피에서 확산."}, {"type": "mcq", "q": "In certain parts of the body, the epidermis ______ to form hair and nails.", "options": ["modifies", "is modified", "is modifying", "modify"], "answer": 1, "explain_ko": "표피는 '변형되는' 대상 → 수동태 is modified."}, {"type": "mcq", "q": "A fungal infection of the hair is known as ______.", "options": ["onychia", "keratosis", "trichomycosis", "melanoma"], "answer": 2, "explain_ko": "tricho-(hair) + myc-(fungus) + -osis."}, {"type": "mcq", "q": "Skin cancer is usually diagnosed by ______.", "options": ["auscultation", "biopsy", "palpation", "X-ray"], "answer": 1, "explain_ko": "조직학적 확진 = biopsy."}, {"type": "synonym", "sentence": "The dermis contains [[sebaceous]] glands.", "options": ["sweat", "oil", "mammary", "fat"], "answer": 1, "explain_ko": "sebaceous = oil(피지). sweat = sudoriferous."}, {"type": "error", "sentence": "Keratin, a protein (A)finding in the top layers of the epidermis, (B)makes the skin (C)tough and (D)waterproof.", "options": ["finding", "makes", "tough", "waterproof"], "answer": 0, "fix": "found", "explain_ko": "케라틴은 '발견되는' 것 → 과거분사 found [g5]."}, {"type": "error", "sentence": "More than 90% of skin cancers (A)are caused (B)by (C)exposure with ultraviolet (D)radiation.", "options": ["are caused", "by", "exposure with", "radiation"], "answer": 2, "fix": "exposure to", "explain_ko": "exposure to [g6]."}, {"type": "listen_gap", "script": "The skin has three main functions: protection, regulation and sensation. As a barrier, it protects the body from micro-organisms, chemicals and radiation. It helps to regulate body temperature through sweat and hair. The skin is also rich in nerve endings, with separate receptors for heat, cold, touch and pain. Damage to these nerves is called neuropathy, and patients with neuropathy may not feel pain when they are injured.", "gap_text": "The skin has three main functions: protection, ___(1)___ and sensation. It helps to regulate body ___(2)___ through sweat and hair. There are separate ___(3)___ for heat, cold, touch and pain. Damage to these nerves is called ___(4)___.", "answers": ["regulation", "temperature", "receptors", "neuropathy"]}, {"type": "reading", "passage": "Melanoma is the most aggressive type of skin cancer. It develops from melanocytes, the cells that produce the pigment melanin. Doctors use the ABCDE rule to check moles: Asymmetry, an irregular Border, more than one Colour, a Diameter larger than 6 mm, and Evolving, which means changing in size, shape or colour. The main risk factor is exposure to ultraviolet (UV) radiation from the sun or from tanning beds. People with fair skin, many moles or a weak immune system are at higher risk. The diagnosis is confirmed by biopsy.", "questions": [{"q": "From which cells does melanoma develop?", "model": "Melanoma develops from melanocytes, the cells that produce melanin."}, {"q": "What does the letter E in the ABCDE rule mean?", "model": "E means Evolving, which means the mole is changing in size, shape or colour."}, {"q": "Who is at higher risk of melanoma?", "model": "People with fair skin, many moles or a weak immune system are at higher risk."}]}, {"type": "writing", "prompt": "Write a paragraph (about 80 words) about ATOPIC ECZEMA and describe what happens in this disorder.", "keywords": ["chronic", "itchy", "dry", "cracked", "childhood", "flare-up", "inflamed", "moisturiser", "no cure"], "model": "Atopic eczema, also called atopic dermatitis, is a chronic skin condition that makes the skin itchy, dry and cracked. It usually starts in childhood, often before the age of one, but it can also appear for the first time in adults. It commonly affects the hands, the insides of the elbows, the backs of the knees and the face. Symptoms come and go: there are calm periods and flare-ups, when the skin becomes red and inflamed. There is no cure, but moisturisers and steroid creams can relieve the symptoms."}, {"type": "mcq", "q": "The ______ is the outermost layer of the skin.", "options": ["epidermis", "dermis", "hypodermis", "fascia"], "answer": 0, "explain_ko": "가장 바깥 = epidermis."}, {"type": "mcq", "q": "Hair grows on almost all of the body surface, ______ the palms and soles.", "options": ["except", "especially", "and", "but also"], "answer": 0, "explain_ko": "손바닥·발바닥 '제외' = except."}, {"type": "mcq", "q": "The ______ glands produce sweat.", "options": ["sebaceous", "sudoriferous", "mammary", "lacrimal"], "answer": 1, "explain_ko": "sudor = 땀."}, {"type": "mcq", "q": "Melanin is produced by cells called ______.", "options": ["keratinocytes", "melanocytes", "fibroblasts", "adipocytes"], "answer": 1, "explain_ko": "melano- = 검은."}, {"type": "mcq", "q": "Basal-cell carcinoma grows slowly and is ______ to spread to distant areas.", "options": ["likely", "unlikely", "able", "possible"], "answer": 1, "explain_ko": "BCC는 원격전이 드묾 → unlikely."}, {"type": "mcq", "q": "A ______ is a small, raised, solid lesion on the skin.", "options": ["papule", "vesicle", "ulcer", "macule"], "answer": 0, "explain_ko": "구진 = papule, 반 = macule(평평)."}, {"type": "mcq", "q": "A ______ is a small blister filled with clear fluid.", "options": ["vesicle", "papule", "nodule", "plaque"], "answer": 0, "explain_ko": "소수포 = vesicle."}, {"type": "mcq", "q": "Wash the wound gently and keep it (A)[clean / cleanly]. If the skin around it becomes red, hot and swollen, it is likely (B)[that / what] the wound is infected, and without treatment the infection can spread (C)[rapid / rapidly].", "options": ["cleanly – that – rapidly", "clean – what – rapid", "clean – that – rapidly", "clean – that – rapid"], "answer": 2, "explain_ko": "(A) keep + O + 형용사 → clean. (B) 가주어 it, 뒤가 완전한 절 → that. (C) 동사 spread 수식 → 부사 rapidly."}, {"type": "mcq", "q": "Doctor: I'm going to take a small sample of skin from the mole and send it to the lab.\nPatient: ______\nDoctor: Not much. I'll numb the area with a local anaesthetic first.", "options": ["When will I get the results?", "How long will it take?", "Will it hurt?", "Do I need to fast?"], "answer": 2, "explain_ko": "\"Not much ... numb the area\" → 통증을 묻는 질문. 생검(biopsy) 전 흔한 환자 질문."}, {"type": "mcq", "q": "Long-term sun exposure reduces the ______ of the skin, so it becomes wrinkled.", "options": ["elastic", "elastically", "elasticity", "elasticated"], "answer": 2, "explain_ko": "the ___ of → 명사 자리 → elasticity(탄력)."}, {"type": "mcq", "q": "If the patient ______ sunscreen regularly when she was younger, she might not have developed so many actinic keratoses.", "options": ["used", "had used", "has used", "would use"], "answer": 1, "explain_ko": "과거 사실의 반대 → 가정법 과거완료 If + had p.p., ... might have p.p. (광선각화증은 누적 자외선 노출과 관련)"}, {"type": "synonym", "sentence": "Atopic eczema makes the skin very [[itchy]].", "options": ["pruritic", "painful", "swollen", "numb"], "answer": 0, "explain_ko": "itchy = pruritic(소양성)."}, {"type": "synonym", "sentence": "The patient has a [[bruise]] on his arm.", "options": ["contusion", "laceration", "abrasion", "fracture"], "answer": 0, "explain_ko": "bruise = contusion(타박상)."}, {"type": "synonym", "sentence": "He has a deep [[cut]] on his forehead.", "options": ["laceration", "contusion", "blister", "abrasion"], "answer": 0, "explain_ko": "찢어진 상처 = laceration."}, {"type": "synonym", "sentence": "She fell and got a small [[graze]] on her knee.", "options": ["abrasion", "laceration", "burn", "bruise"], "answer": 0, "explain_ko": "graze = abrasion(찰과상)."}, {"type": "synonym", "sentence": "The rash spread to her [[scalp]].", "options": ["skin of the head", "sole of the foot", "palm", "neck"], "answer": 0, "explain_ko": "scalp = 두피."}, {"type": "error", "sentence": "The skin (A)is one of the (B)largest organ (C)in the body in surface area (D)and weight.", "options": ["is", "largest organ", "in the body", "and"], "answer": 1, "fix": "largest organs", "explain_ko": "one of the + 최상급 + 복수명사."}, {"type": "error", "sentence": "Many patients find the itching of eczema more (A)distressed than the rash itself, because it (B)keeps them awake at night. Scratching makes the skin (C)more inflamed, (D)which leads to further itching.", "options": ["distressed", "keeps", "more inflamed", "which"], "answer": 0, "fix": "distressing", "explain_ko": "가려움이 고통을 '주는' 것 → 현재분사 distressing. (사람이 느끼면 distressed) 감정 분사 구분은 수능 빈출."}, {"type": "error", "sentence": "Doctors advise people with many moles (A)to check their skin regularly, (B)because their risk of melanoma is higher than (C)those of people with few moles, (D)especially if they burn easily.", "options": ["to check", "because", "those", "especially"], "answer": 2, "fix": "that", "explain_ko": "비교 대상 their risk(단수)를 받는 대명사 → that. 복수명사를 받을 때만 those."}, {"type": "error", "sentence": "Patients with neuropathy may not feel pain (A)when they (B)suffering (C)an injury, (D)which increases the risk of wounds.", "options": ["when", "suffering", "an injury", "which"], "answer": 1, "fix": "suffer", "explain_ko": "they 뒤 정동사 필요 → suffer."}, {"type": "error", "sentence": "Most basal-cell carcinomas (A)are occurred on areas of skin (B)that have been exposed to the sun, such as the face. Although they rarely spread, they should be removed (C)early, (D)since they can destroy nearby tissue.", "options": ["are occurred", "that", "early", "since"], "answer": 0, "fix": "occur", "explain_ko": "occur는 자동사 → 수동태 불가. (happen, appear, consist, result도 같음)"}, {"type": "listen_tf", "script": "Nurse: I've had a look at your leg wound, Mrs Lam. The skin around it is red and warm, and there is some yellow discharge. These are signs of infection, so I'll ask the doctor to see you today. I'll clean the wound with saline and put on a new dressing. Please don't let the dressing get wet.", "statements": [{"s": "The skin around the wound is red and warm.", "answer": true}, {"s": "The discharge is clear.", "answer": false}, {"s": "The doctor will see her next week.", "answer": false}, {"s": "The nurse will clean the wound with saline.", "answer": true}, {"s": "It is fine to let the dressing get wet.", "answer": false}]}]}, {"id": "u3", "title": "Musculoskeletal System", "title_ko": "근골격계", "vocab": [{"term": "sternum", "ko": "흉골", "lay": "breastbone", "example": "The sternum connects to the ribs via cartilage."}, {"term": "clavicle", "ko": "쇄골", "lay": "collarbone", "example": "He fractured his clavicle in a fall."}, {"term": "scapula", "ko": "견갑골", "lay": "shoulder blade", "example": "The scapula forms part of the shoulder joint."}, {"term": "coccyx", "ko": "미골", "lay": "tailbone", "example": "She bruised her coccyx when she slipped."}, {"term": "patella", "ko": "슬개골", "lay": "kneecap", "example": "The patella protects the knee joint."}, {"term": "tendon / ligament", "ko": "힘줄 / 인대", "lay": "muscle-to-bone / bone-to-bone", "example": "Ligaments connect bones to other bones."}, {"term": "cartilage", "ko": "연골", "lay": "smooth tissue at joints", "example": "Cartilage covers the ends of bones in a joint."}, {"term": "red / yellow bone marrow", "ko": "적색/황색 골수", "lay": "blood-making / fat-storing marrow", "example": "Red bone marrow produces blood cells."}, {"term": "greenstick fracture", "ko": "생목골절", "lay": "incomplete break, common in children", "example": "A greenstick fracture is incomplete."}, {"term": "comminuted fracture", "ko": "분쇄골절", "lay": "bone broken into many pieces", "example": "A comminuted fracture fragments the bone."}, {"term": "transverse / oblique / spiral fracture", "ko": "횡/사/나선 골절", "lay": "straight across / angled / twisted", "example": "A spiral fracture is caused by twisting."}, {"term": "osteoporosis", "ko": "골다공증", "lay": "weak, thin bones", "example": "Osteoporosis is called a silent disease."}, {"term": "rheumatoid arthritis", "ko": "류마티스 관절염", "lay": "autoimmune joint disease", "example": "Rheumatoid arthritis causes morning stiffness."}], "exercises": [{"type": "mcq", "q": "The adult human skeleton ______ 206 bones.", "options": ["consists of", "comprises of", "makes up of", "composes"], "answer": 0, "explain_ko": "consist of ✓ / comprise(of 없음) / be composed of [g1]."}, {"type": "mcq", "q": "A fracture in which the bone is broken into several fragments is a ______ fracture.", "options": ["greenstick", "comminuted", "transverse", "fissured"], "answer": 1, "explain_ko": "comminuted = 분쇄."}, {"type": "mcq", "q": "A ______ fracture is caused by twisting a bone excessively.", "options": ["spiral", "oblique", "stress", "pathological"], "answer": 0, "explain_ko": "비틀림 → spiral. stress fracture는 반복 미세손상."}, {"type": "mcq", "q": "______ connect bones to other bones at a joint.", "options": ["Tendons", "Ligaments", "Cartilages", "Muscles"], "answer": 1, "explain_ko": "ligament: 뼈-뼈 / tendon: 근육-뼈."}, {"type": "mcq", "q": "A fatigue fracture is ______ repeated minor trauma, such as long-distance running.", "options": ["despite", "because", "due to", "in spite of"], "answer": 2, "explain_ko": "명사구 앞 원인 = due to (because 뒤에는 절)."}, {"type": "synonym", "sentence": "He fell off his bike and broke his [[collarbone]].", "options": ["sternum", "scapula", "clavicle", "patella"], "answer": 2, "explain_ko": "collarbone = clavicle."}, {"type": "synonym", "sentence": "The [[breastbone]] forms the front of the rib cage.", "options": ["costae", "sternum", "coccyx", "sacrum"], "answer": 1, "explain_ko": "breastbone = sternum."}, {"type": "error", "sentence": "Physiotherapy after a fracture helps patients (A)regain movement. The exercises are designed (B)to strengthen the muscles (C)surrounding the joint and to prevent it (D)to become stiff.", "options": ["regain", "to strengthen", "surrounding", "to become"], "answer": 3, "fix": "from becoming", "explain_ko": "prevent + O + from -ing. help + O + (to) 원형은 맞음."}, {"type": "error", "sentence": "Osteoporosis (A)is called a 'silent' disease (B)because patients (C)typical have no symptoms (D)until a bone breaks.", "options": ["is called", "because", "typical", "until"], "answer": 2, "fix": "typically", "explain_ko": "동사 수식 → 부사 typically [g7]."}, {"type": "listen_tf", "script": "Doctor: Your X-ray shows a greenstick fracture of the forearm. This is an incomplete fracture, and it is common in children because their bones are softer and more flexible than adult bones. We will put your arm in a cast for about four weeks. Please keep the cast dry, and come back straight away if your fingers become numb or very swollen.", "statements": [{"s": "The patient has a complete fracture of the forearm.", "answer": false}, {"s": "This type of fracture is common in children.", "answer": true}, {"s": "The arm will be in a cast for about four weeks.", "answer": true}, {"s": "It is fine to get the cast wet.", "answer": false}, {"s": "The patient should come back if the fingers become numb.", "answer": true}]}, {"type": "reading", "passage": "Osteoporosis is a disease in which bone mass and bone density decrease, making the bones weak and fragile. It is often called a 'silent' disease because most people have no symptoms until they break a bone. Fractures happen most commonly in the hip, the spine and the wrist. The disease mainly affects postmenopausal women, because the level of oestrogen falls after menopause, and older men. Treatment includes weight-bearing exercise, calcium and vitamin D supplements, and medications such as bisphosphonates.", "questions": [{"q": "Why is osteoporosis called a 'silent' disease?", "model": "It is called a silent disease because most people have no symptoms until they break a bone."}, {"q": "Where do osteoporotic fractures happen most commonly?", "model": "They happen most commonly in the hip, the spine and the wrist."}, {"q": "Why are postmenopausal women at higher risk?", "model": "They are at higher risk because the level of oestrogen falls after menopause."}]}, {"type": "writing", "prompt": "Write a paragraph (about 80 words) about RHEUMATOID ARTHRITIS and describe what happens in this disorder.", "keywords": ["autoimmune disease", "attack", "tissues", "inflammation", "joint pain", "swollen", "stiffness", "damaged", "fever", "lifestyle adjustment", "home remedies"], "model": "Rheumatoid arthritis (RA) is a chronic autoimmune disease in which the immune system mistakenly attacks the body's own tissues, mainly the lining of the joints. This causes inflammation, so the joints become painful, swollen and stiff, especially in the morning. Over time, the cartilage and bone can be damaged and the joints may become deformed. Patients may also have fever and tiredness. Although there is no cure, medication, home remedies and lifestyle adjustment can control the symptoms and prevent further medical problems."}, {"type": "mcq", "q": "Osteoporosis is a condition (A)[in which / which] bones become weak and brittle. It often goes unnoticed until a fracture occurs, (B)[because / because of] it causes no symptoms. Regular weight-bearing exercise, together with enough calcium and vitamin D, (C)[help / helps] to prevent it.", "options": ["which – because – helps", "in which – because of – help", "in which – because – helps", "in which – because – help"], "answer": 2, "explain_ko": "(A) 뒤가 완전한 절 → in which. (B) 뒤에 절 → 접속사 because. (C) 주어 exercise(단수), together with 이하는 삽입 → helps."}, {"type": "mcq", "q": "______ connect muscles to bones.", "options": ["Tendons", "Ligaments", "Cartilages", "Joints"], "answer": 0, "explain_ko": "근육-뼈 = tendon."}, {"type": "mcq", "q": "A(n) ______ fracture is one in which the broken bone breaks through the skin.", "options": ["open", "simple", "greenstick", "stress"], "answer": 0, "explain_ko": "개방(복합) 골절 = open/compound."}, {"type": "mcq", "q": "A ______ fracture occurs in a bone that is weakened by disease.", "options": ["pathological", "stress", "spiral", "comminuted"], "answer": 0, "explain_ko": "병적 골절 = pathological."}, {"type": "mcq", "q": "Patient: My knee gets really stiff in the morning.\nDoctor: ______\nPatient: Only about ten minutes, then it loosens up.", "options": ["Did you injure it recently?", "Which knee is it?", "How long does the stiffness last?", "Is it swollen?"], "answer": 2, "explain_ko": "답이 시간(ten minutes) → 지속시간 질문. 아침 강직 30분 미만은 골관절염, 1시간 이상은 염증성 관절염을 시사."}, {"type": "mcq", "q": "She was unable to walk because of severe ______ in her ankle.", "options": ["swollen", "swelling", "swell", "swelled"], "answer": 1, "explain_ko": "severe(형용사)가 꾸미는 명사 자리 → swelling."}, {"type": "mcq", "q": "The X-ray shows an old, healed fracture of his rib. He ______ it years ago without realising.", "options": ["should have broken", "cannot have broken", "must break", "must have broken"], "answer": 3, "explain_ko": "과거에 대한 강한 추측 → must have p.p. (should have p.p. = 했어야 했는데)"}, {"type": "mcq", "q": "In a transverse fracture, the break occurs at a right angle ______ the axis of the bone.", "options": ["to", "with", "from", "by"], "answer": 0, "explain_ko": "at a right angle to."}, {"type": "mcq", "q": "Osteoporosis is the major cause of fractures in ______ women.", "options": ["postmenopausal", "premenopausal", "pregnant", "adolescent"], "answer": 0, "explain_ko": "폐경 후 에스트로겐 감소."}, {"type": "mcq", "q": "The ______ joint is an example of a ball-and-socket joint.", "options": ["hip", "elbow", "knee", "ankle"], "answer": 0, "explain_ko": "구관절: 고관절·어깨."}, {"type": "mcq", "q": "Muscles that bend a joint are called ______.", "options": ["flexors", "extensors", "abductors", "rotators"], "answer": 0, "explain_ko": "굽힘 = flexion."}, {"type": "synonym", "sentence": "She injured her [[shoulder blade]] in the accident.", "options": ["scapula", "clavicle", "sternum", "humerus"], "answer": 0, "explain_ko": "shoulder blade = scapula."}, {"type": "synonym", "sentence": "He has pain in his [[kneecap]].", "options": ["patella", "tibia", "femur", "fibula"], "answer": 0, "explain_ko": "kneecap = patella."}, {"type": "synonym", "sentence": "The [[thigh bone]] is the strongest bone in the body.", "options": ["femur", "humerus", "tibia", "radius"], "answer": 0, "explain_ko": "thigh bone = femur."}, {"type": "synonym", "sentence": "She has a fracture of the [[shinbone]].", "options": ["tibia", "fibula", "ulna", "radius"], "answer": 0, "explain_ko": "shinbone = tibia."}, {"type": "synonym", "sentence": "The patient fell off a ladder and [[fractured]] his wrist.", "options": ["broke", "sprained", "bruised", "dislocated"], "answer": 0, "explain_ko": "fracture = break."}, {"type": "error", "sentence": "The adult skeleton (A)consists (B)206 bones (C)together with tendons, ligaments (D)and cartilage.", "options": ["consists", "206 bones", "together with", "and"], "answer": 0, "fix": "consists of", "explain_ko": "consist는 자동사 → of 필요 [g1]."}, {"type": "error", "sentence": "The number of hip fractures in older people (A)is rising as the population ages. A fall from standing height, together with weak bones, (B)are often enough to break the hip, (C)which is why fall prevention (D)is so important.", "options": ["is rising", "are", "which", "is"], "answer": 1, "fix": "is", "explain_ko": "주어는 A fall(단수), together with ~는 삽입 → is. The number of + 복수명사 → 단수동사 is(맞음)."}, {"type": "error", "sentence": "Physiotherapists help patients (A)to regain movement, (B)reducing pain and (C)to prevent (D)further injury.", "options": ["to regain", "reducing", "to prevent", "further"], "answer": 1, "fix": "(to) reduce", "explain_ko": "to regain, to reduce, to prevent 병렬 [g8]."}, {"type": "error", "sentence": "After the cast (A)was removed, the patient was told to (B)lay on his back and (C)raise his leg slowly, (D)keeping the knee straight.", "options": ["was removed", "lay", "raise", "keeping"], "answer": 1, "fix": "lie", "explain_ko": "눕다 = 자동사 lie (lay는 타동사 '눕히다'). raise는 타동사 '들어 올리다'로 맞음."}, {"type": "error", "sentence": "Rheumatoid arthritis is an autoimmune disease (A)which the immune system (B)attacks (C)the lining (D)of the joints.", "options": ["which", "attacks", "the lining", "of"], "answer": 0, "fix": "in which", "explain_ko": "뒤가 완전한 절 → in which [g4]."}, {"type": "listen_gap", "script": "Doctor: Mrs Nguyen, your bone density scan shows that you have osteoporosis. This means your bones have become thin and weak, so they break more easily. I'd like you to take calcium and vitamin D every day, and to do some weight-bearing exercise, such as walking, for thirty minutes a day. I'll also prescribe a tablet called a bisphosphonate, which you take once a week.", "gap_text": "Her bones have become thin and ___(1)___. She should take calcium and vitamin ___(2)___ every day. She should walk for thirty ___(3)___ a day. The bisphosphonate is taken once a ___(4)___.", "answers": ["weak", "D", "minutes", "week"]}]}, {"id": "u4", "title": "Blood & Immunity", "title_ko": "혈액과 면역", "vocab": [{"term": "erythrocyte", "ko": "적혈구", "lay": "red blood cell", "example": "Erythrocytes transport oxygen."}, {"term": "leukocyte", "ko": "백혈구", "lay": "white blood cell", "example": "Leukocytes fight infection."}, {"term": "thrombocyte", "ko": "혈소판", "lay": "platelet", "example": "Thrombocytes are mainly concerned with clotting."}, {"term": "coagulation", "ko": "응고", "lay": "clotting", "example": "Vitamin K is needed for coagulation."}, {"term": "hemoglobin", "ko": "혈색소", "lay": "oxygen-carrying protein", "example": "Hemoglobin contains iron."}, {"term": "hemophilia", "ko": "혈우병", "lay": "bleeding disorder", "example": "Hemophilia mainly affects males."}, {"term": "leukemia", "ko": "백혈병", "lay": "blood cancer", "example": "Leukemia starts in the bone marrow."}, {"term": "innate immunity", "ko": "선천면역", "lay": "natural immunity from birth", "example": "Skin is part of innate immunity."}, {"term": "adaptive (acquired) immunity", "ko": "적응(획득)면역", "lay": "immunity built over life", "example": "Adaptive immunity develops after vaccination."}, {"term": "passive immunity", "ko": "수동면역", "lay": "borrowed, short-term immunity", "example": "Breast milk gives passive immunity."}, {"term": "antigen / antibody", "ko": "항원 / 항체", "lay": "foreign marker / defence protein", "example": "Antibodies bind to antigens."}, {"term": "immunization", "ko": "예방접종", "lay": "vaccination", "example": "Immunization protects against measles."}], "exercises": [{"type": "mcq", "q": "______ immunity is present from birth and includes barriers such as the skin.", "options": ["Adaptive", "Passive", "Innate", "Acquired"], "answer": 2, "explain_ko": "태어날 때부터 = innate (natural)."}, {"type": "mcq", "q": "Antibodies in a mother's breast milk give her baby ______ immunity.", "options": ["innate", "passive", "adaptive", "lymphatic"], "answer": 1, "explain_ko": "외부에서 '빌린' 단기 면역 = passive."}, {"type": "mcq", "q": "Hemophilia is a rare disorder in which the blood does not clot normally because it ______ clotting proteins.", "options": ["lacks", "lacked", "lacks of", "is lacking of"], "answer": 0, "explain_ko": "lack은 타동사(of 없음), 일반적 사실 → 현재형."}, {"type": "mcq", "q": "Adaptive immunity is also called ______ immunity.", "options": ["natural", "acquired", "passive", "innate"], "answer": 1, "explain_ko": "adaptive = acquired."}, {"type": "synonym", "sentence": "[[Erythrocytes]] carry oxygen from the lungs to the tissues.", "options": ["Red blood cells", "Hemoglobin", "Platelets", "White blood cells"], "answer": 0, "explain_ko": "erythro-(red) + -cyte(cell)."}, {"type": "synonym", "sentence": "[[Thrombocytes]] help to stop bleeding.", "options": ["Leukocytes", "Platelets", "Plasma cells", "Erythrocytes"], "answer": 1, "explain_ko": "thrombocyte = platelet."}, {"type": "error", "sentence": "Platelets are (A)main concerned (B)with blood (C)coagulation, or the (D)formation of clots.", "options": ["main", "with", "coagulation", "formation"], "answer": 0, "fix": "mainly", "explain_ko": "과거분사 concerned 수식 → 부사 mainly [g7]."}, {"type": "error", "sentence": "Mature red blood cells are (A)biconcave, (B)disc-shaped cells (C)that (D)contains no nucleus.", "options": ["biconcave", "disc-shaped", "that", "contains"], "answer": 3, "fix": "contain", "explain_ko": "선행사 cells(복수) → contain. 참고: 성숙 RBC는 무핵(anucleate) — 'nucleated'가 틀린 단어로 나온 기출 있음."}, {"type": "listen_gap", "script": "Vaccines work by training the adaptive immune system. A vaccine contains a weakened or inactive form of a germ, or a part of it, called an antigen. The body responds by making antibodies and memory cells. If the real germ enters the body later, the memory cells recognize it, and the immune system responds quickly before the person becomes seriously ill.", "gap_text": "Vaccines work by training the ___(1)___ immune system. A vaccine contains a part of a germ called an ___(2)___. The body responds by making ___(3)___ and memory cells. Later, the ___(4)___ cells recognize the real germ.", "answers": ["adaptive", "antigen", "antibodies", "memory"]}, {"type": "reading", "passage": "Hemophilia is a rare inherited disorder in which the blood does not clot normally because it lacks enough clotting factors. People with hemophilia may bleed for a longer time after an injury or surgery. They may also have bleeding inside the joints, which causes pain and swelling. Because the gene is carried on the X chromosome, the disease mainly affects males. Treatment involves replacing the missing clotting factor by injection.", "questions": [{"q": "Why does the blood of people with hemophilia not clot normally?", "model": "It does not clot normally because it lacks enough clotting factors."}, {"q": "What happens when bleeding occurs inside the joints?", "model": "It causes pain and swelling."}, {"q": "Why does hemophilia mainly affect males?", "model": "It mainly affects males because the gene is carried on the X chromosome."}]}, {"type": "mcq", "q": "Plasma is the liquid part of the blood and makes ______ about 55% of its volume.", "options": ["up", "of", "out", "for"], "answer": 0, "explain_ko": "make up = 구성하다."}, {"type": "mcq", "q": "______ is a condition in which there are not enough healthy red blood cells or hemoglobin.", "options": ["Anemia", "Leukemia", "Hemophilia", "Thrombosis"], "answer": 0, "explain_ko": "빈혈 = anemia."}, {"type": "mcq", "q": "Leukemia is a cancer of the ______.", "options": ["blood-forming tissues", "skin", "bones only", "nerves"], "answer": 0, "explain_ko": "조혈조직(골수)의 암."}, {"type": "mcq", "q": "Anaemia is a condition (A)[which / in which] there are not enough healthy red blood cells (B)[carrying / carried] oxygen to the tissues. Patients often feel tired, and some become short of breath (C)[during / while] climbing stairs.", "options": ["which – carrying – while", "in which – carried – during", "in which – carrying – during", "in which – carrying – while"], "answer": 3, "explain_ko": "(A) 완전한 절 → in which. (B) 적혈구가 산소를 '운반하는' 능동 → carrying. (C) 뒤에 -ing → 접속사 while (during + 명사)."}, {"type": "mcq", "q": "Doctor: Your blood test shows that your haemoglobin is low.\nPatient: ______\nDoctor: It means you have fewer red blood cells than normal. This is called anaemia.", "options": ["Who will tell my family?", "Can I go home now?", "What does that mean exactly?", "How did you test it?"], "answer": 2, "explain_ko": "\"It means ...\" → 의미를 묻는 질문. 검사 결과를 쉬운 말로 풀어 주는 대화."}, {"type": "mcq", "q": "Viruses often invade the human body ______ mucous membranes.", "options": ["via", "by mean", "though", "within"], "answer": 0, "explain_ko": "via = ~을 통해."}, {"type": "mcq", "q": "Chemotherapy can ______ the immune system, so patients are more likely to get infections.", "options": ["weak", "weaken", "weakness", "weakly"], "answer": 1, "explain_ko": "조동사 can 뒤 동사원형 자리 → weaken (-en = ~하게 만들다)."}, {"type": "mcq", "q": "A blood clot that forms inside a blood vessel is called a ______.", "options": ["thrombus", "plaque", "aneurysm", "hematoma"], "answer": 0, "explain_ko": "혈전 = thrombus (이동하면 embolus)."}, {"type": "mcq", "q": "A collection of blood outside the vessels, such as a large bruise, is a ______.", "options": ["hematoma", "thrombus", "anemia", "embolus"], "answer": 0, "explain_ko": "혈종 = hematoma."}, {"type": "mcq", "q": "Blood group O negative is known as the universal ______.", "options": ["donor", "recipient", "acceptor", "receiver"], "answer": 0, "explain_ko": "O− = 만능 공혈자, AB+ = 만능 수혈자."}, {"type": "mcq", "q": "______ a vaccine is given after exposure to rabies, the more effective it is.", "options": ["The sooner", "Sooner", "As soon as", "The soonest"], "answer": 0, "explain_ko": "the 비교급 ~, the 비교급 … (~할수록 더 …하다). 광견병 노출 후 예방접종은 가능한 빨리."}, {"type": "synonym", "sentence": "[[Leukocytes]] protect the body from infection.", "options": ["White blood cells", "Red blood cells", "Platelets", "Plasma proteins"], "answer": 0, "explain_ko": "leuko- = white."}, {"type": "synonym", "sentence": "The patient has a low [[platelet]] count.", "options": ["thrombocyte", "erythrocyte", "leukocyte", "lymphocyte"], "answer": 0, "explain_ko": "platelet = thrombocyte."}, {"type": "synonym", "sentence": "The [[clotting]] of blood stops bleeding.", "options": ["coagulation", "circulation", "filtration", "secretion"], "answer": 0, "explain_ko": "clotting = coagulation."}, {"type": "synonym", "sentence": "He was [[immunized]] against hepatitis B.", "options": ["vaccinated", "infected", "treated", "tested"], "answer": 0, "explain_ko": "immunize = vaccinate."}, {"type": "synonym", "sentence": "The wound became [[septic]].", "options": ["infected", "healed", "swollen", "numb"], "answer": 0, "explain_ko": "septic = infected."}, {"type": "error", "sentence": "Vaccines work by showing the immune system (A)that a pathogen looks like, so that it can respond (B)more quickly if the real infection occurs. This is (C)why vaccinated people usually have (D)milder illness.", "options": ["that", "more quickly", "why", "milder"], "answer": 0, "fix": "what", "explain_ko": "look like의 목적어가 빠진 불완전한 절 + 선행사 없음 → what (= the thing that)."}, {"type": "error", "sentence": "(A)Without platelets, even a small cut (B)will bleed for a long time. Patients (C)whose platelet count is very low may need a transfusion (D)before they undergo surgery.", "options": ["Without", "will bleed", "whose", "before"], "answer": 1, "fix": "would bleed", "explain_ko": "Without ~ = If it were not for ~ (가정법) → 주절은 would + 원형."}, {"type": "error", "sentence": "(A)Infecting with HIV, a person may have no symptoms for years. However, the virus gradually (B)destroys CD4 cells, (C)leaving the body (D)unable to fight common infections.", "options": ["Infecting", "destroys", "leaving", "unable"], "answer": 0, "fix": "Infected", "explain_ko": "사람이 HIV에 '감염된' 수동 → 분사구문 Infected. leaving은 결과의 능동 분사구문으로 맞음."}, {"type": "error", "sentence": "Hemophilia is a disorder (A)which the blood (B)does not clot (C)normally (D)after an injury.", "options": ["which", "does not clot", "normally", "after"], "answer": 0, "fix": "in which", "explain_ko": "뒤가 완전한 절 → in which [g4]."}, {"type": "error", "sentence": "People (A)whose immune system is weak (B)are (C)easy infected (D)by viruses.", "options": ["whose", "are", "easy", "by"], "answer": 2, "fix": "easily", "explain_ko": "과거분사 수식 → 부사 easily [g7]."}, {"type": "listen_tf", "script": "Doctor: Your blood test shows that your haemoglobin is low, so you have anaemia. This explains why you've been feeling tired and short of breath. The cause is probably not enough iron in your diet. I'll prescribe iron tablets. Take one tablet a day on an empty stomach, and come back for another blood test in six weeks.", "statements": [{"s": "The patient's haemoglobin is high.", "answer": false}, {"s": "The patient has been feeling tired and short of breath.", "answer": true}, {"s": "The cause is probably too much iron in the diet.", "answer": false}, {"s": "The iron tablets should be taken with meals.", "answer": false}, {"s": "The patient will have another blood test in six weeks.", "answer": true}]}]}, {"id": "u5", "title": "Cardiovascular & Respiratory System", "title_ko": "심혈관·호흡계", "vocab": [{"term": "atrium (pl. atria)", "ko": "심방", "lay": "upper chamber (= auricle)", "example": "The atria receive blood from the veins."}, {"term": "ventricle", "ko": "심실", "lay": "lower chamber", "example": "The ventricles pump blood into the arteries."}, {"term": "septum", "ko": "중격", "lay": "dividing wall", "example": "The heart is divided into two sides by a septum."}, {"term": "myocardium", "ko": "심근층", "lay": "heart muscle (middle layer)", "example": "The myocardium is responsible for pumping."}, {"term": "endocardium / epicardium", "ko": "심내막 / 심외막", "lay": "inner / outer layer", "example": "The endocardium lines the chambers."}, {"term": "pericardium", "ko": "심막", "lay": "sac around the heart", "example": "The pericardium protects the heart."}, {"term": "arteriole / venule / capillary", "ko": "세동맥 / 세정맥 / 모세혈관", "lay": "small artery / small vein / tiny vessel", "example": "Arteries lead to arterioles, which lead to capillaries."}, {"term": "apex", "ko": "심첨", "lay": "pointed tip of the heart", "example": "The apex points towards the diaphragm."}, {"term": "trachea", "ko": "기관", "lay": "windpipe", "example": "The trachea divides into two bronchi."}, {"term": "bronchiole", "ko": "세기관지", "lay": "small airway", "example": "Terminal bronchioles branch repeatedly."}, {"term": "alveolus (pl. alveoli)", "ko": "폐포", "lay": "air sac", "example": "Gas exchange takes place in the alveoli."}, {"term": "hypertension", "ko": "고혈압", "lay": "high blood pressure", "example": "Hypertension is a silent killer."}], "exercises": [{"type": "mcq", "q": "The heart pumps blood ______ elastic arteries, which lead to arterioles.", "options": ["from", "into", "onto", "upon"], "answer": 1, "explain_ko": "pump A into B."}, {"type": "mcq", "q": "Blood (A)[returning / returned] from the body enters the right atrium and is then pumped to the lungs, (B)[where / which] it picks up oxygen. The left ventricle has a thicker wall than the right, because it must generate (C)[much / very] higher pressure.", "options": ["returned – where – much", "returning – which – very", "returning – where – very", "returning – where – much"], "answer": 3, "explain_ko": "(A) return은 자동사, 피가 '돌아오는' 능동 → returning. (B) 뒤가 완전한 절 → where. (C) 비교급 강조 → much (very 불가)."}, {"type": "mcq", "q": "The two upper chambers are called the atria, ______ blood is received from the veins.", "options": ["which", "whose", "that", "where"], "answer": 3, "explain_ko": "장소 선행사 + 완전한 수동절 → where [g4]."}, {"type": "mcq", "q": "The heart is a cone-shaped hollow organ ______ in the central part of the chest.", "options": ["that situated", "is situated", "situated", "are situated"], "answer": 2, "explain_ko": "분사 후치수식 situated (= which is situated) [g5]."}, {"type": "mcq", "q": "Gas exchange between air and blood takes place in the ______.", "options": ["bronchi", "trachea", "alveoli", "pleura"], "answer": 2, "explain_ko": "폐포(alveoli)."}, {"type": "synonym", "sentence": "The [[middle layer of the heart wall]] is responsible for the pumping action.", "options": ["Epicardium", "Endocardium", "Myocardium", "Pericardium"], "answer": 2, "explain_ko": "myo-(muscle) = 중간 근육층."}, {"type": "synonym", "sentence": "The return of blood to the heart [[takes place]] through the veins.", "options": ["occurs", "participates", "empties", "includes"], "answer": 0, "explain_ko": "take place = occur."}, {"type": "error", "sentence": "The bronchioles divide into tiny air sacs called alveoli. Because (A)its walls are extremely thin, oxygen can pass (B)easily into the capillaries (C)that surround them, (D)while carbon dioxide moves in the opposite direction.", "options": ["its", "easily", "that", "while"], "answer": 0, "fix": "their", "explain_ko": "가리키는 것은 alveoli(복수) → their. 대명사 수일치는 수능 빈출."}, {"type": "error", "sentence": "The function of lymph (A)is similar (B)as that of blood, (C)but it (D)contains no red blood cells.", "options": ["is similar", "as", "but it", "contains"], "answer": 1, "fix": "to", "explain_ko": "similar to [g6]."}, {"type": "listen_tf", "script": "Nurse: Mr Lee, your blood pressure is one hundred and fifty over ninety-five, which is a bit high. Your pulse is eighty-eight and regular. Your oxygen saturation is ninety-seven percent, which is normal. Have you been taking your medication? Patient: I'm afraid I forgot it this morning. Nurse: Please take it with breakfast tomorrow. I'll check your blood pressure again in two hours.", "statements": [{"s": "The patient's blood pressure is normal.", "answer": false}, {"s": "The patient's pulse is irregular.", "answer": false}, {"s": "His oxygen saturation is normal.", "answer": true}, {"s": "He took his medication this morning.", "answer": false}, {"s": "The nurse will check his blood pressure again in two hours.", "answer": true}]}, {"type": "reading", "passage": "The heart is a hollow, muscular organ about the size of a fist. It lies in the thoracic cavity between the lungs, with its apex pointing down towards the left. The heart wall has three layers: the outer epicardium, the middle myocardium and the inner endocardium, and the whole heart is enclosed in a protective sac called the pericardium. The heart has four chambers. The two upper chambers, the atria, receive blood from the veins. The two lower chambers, the ventricles, pump blood into the arteries. The right side pumps blood to the lungs, while the left side pumps blood to the rest of the body.", "questions": [{"q": "How big is the heart?", "model": "The heart is about the size of a fist."}, {"q": "What is the difference between the atria and the ventricles?", "model": "The atria receive blood from the veins, while the ventricles pump blood into the arteries."}, {"q": "Where does the right side of the heart pump blood?", "model": "The right side of the heart pumps blood to the lungs."}]}, {"type": "writing", "prompt": "Write a paragraph (about 80 words) about HYPERTENSION and describe what happens in this disorder.", "keywords": ["high blood pressure", "artery walls", "silent killer", "risk factors", "salt", "obesity", "heart", "kidneys", "stroke", "lifestyle changes"], "model": "Hypertension, or high blood pressure, is a condition in which the force of blood against the artery walls is too high, commonly defined as 140/90 mmHg or above. It is often called a 'silent killer' because most patients have no symptoms. Risk factors include ageing, obesity, a high-salt diet, smoking and lack of exercise. If it is not treated, hypertension can damage the heart, brain and kidneys and lead to a heart attack or stroke. Treatment includes lifestyle changes and antihypertensive drugs."}, {"type": "mcq", "q": "The ______ valve lies between the left atrium and the left ventricle.", "options": ["mitral", "tricuspid", "pulmonary", "aortic"], "answer": 0, "explain_ko": "좌측 방실판 = mitral(bicuspid)."}, {"type": "mcq", "q": "______ carry blood away from the heart.", "options": ["Arteries", "Veins", "Venules", "Lymph vessels"], "answer": 0, "explain_ko": "Away = Artery."}, {"type": "mcq", "q": "The ______ is the largest artery in the body.", "options": ["aorta", "vena cava", "pulmonary vein", "carotid artery"], "answer": 0, "explain_ko": "대동맥 = aorta."}, {"type": "mcq", "q": "Capillaries are the ______ blood vessels in the body.", "options": ["smallest", "smaller", "small", "most small"], "answer": 0, "explain_ko": "the + 최상급."}, {"type": "mcq", "q": "The trachea divides into the right and left ______.", "options": ["bronchi", "bronchioles", "alveoli", "pleurae"], "answer": 0, "explain_ko": "기관 → 주기관지."}, {"type": "mcq", "q": "Doctor: Do you get short of breath when you lie flat?\nPatient: Yes, ______\nDoctor: That's called orthopnoea. It can be a sign of heart failure.", "options": ["I only get it when I run.", "I cough up green phlegm.", "I need three pillows to sleep.", "it started after a cold."], "answer": 2, "explain_ko": "누우면 숨참 → 베개를 여러 개 받쳐야 잠 → 기좌호흡(orthopnoea), 심부전 징후."}, {"type": "mcq", "q": "Smoking causes ______ of the arteries, which increases the risk of heart attack.", "options": ["narrowed", "narrowing", "narrowly", "narrow"], "answer": 1, "explain_ko": "causes의 목적어 + of → 명사(동명사) narrowing."}, {"type": "mcq", "q": "Only after the patient had stopped smoking ______ his cough begin to improve.", "options": ["had", "was", "did", "does"], "answer": 2, "explain_ko": "Only + 부사구/절 문두 → 주절 도치 did + S + 원형 (begin)."}, {"type": "mcq", "q": "Chest pain caused by reduced blood flow to the heart muscle is called ______.", "options": ["angina", "asthma", "arrhythmia", "anemia"], "answer": 0, "explain_ko": "협심증 = angina (pectoris)."}, {"type": "mcq", "q": "A heart attack is also called a ______.", "options": ["myocardial infarction", "stroke", "heart murmur", "pneumonia"], "answer": 0, "explain_ko": "MI = 심근경색."}, {"type": "mcq", "q": "An irregular heartbeat is called a(n) ______.", "options": ["arrhythmia", "hypertension", "bradypnea", "angina"], "answer": 0, "explain_ko": "부정맥 = arrhythmia."}, {"type": "synonym", "sentence": "Her heart rate is [[faster than normal]].", "options": ["tachycardia", "bradycardia", "arrhythmia", "hypotension"], "answer": 0, "explain_ko": "tachy- = 빠른."}, {"type": "synonym", "sentence": "He complains of [[shortness of breath]].", "options": ["dyspnea", "apnea", "cough", "wheeze"], "answer": 0, "explain_ko": "dys- + pnea(호흡)."}, {"type": "synonym", "sentence": "The [[windpipe]] carries air to the lungs.", "options": ["trachea", "esophagus", "larynx", "pharynx"], "answer": 0, "explain_ko": "windpipe = trachea."}, {"type": "synonym", "sentence": "Blood from the veins is received in the [[auricles]].", "options": ["atria", "ventricles", "septum", "venules"], "answer": 0, "explain_ko": "auricles = atria."}, {"type": "synonym", "sentence": "[[Hypertension]] is a major risk factor for stroke.", "options": ["High blood pressure", "Low blood pressure", "High blood sugar", "Heart failure"], "answer": 0, "explain_ko": "hyper- + tension."}, {"type": "error", "sentence": "The heart (A)is (B)approximate (C)the size of (D)a fist.", "options": ["is", "approximate", "the size of", "a fist"], "answer": 1, "fix": "approximately", "explain_ko": "부사 자리 [g7]."}, {"type": "error", "sentence": "The left ventricle (A)pumps blood (B)to the whole body, (C)so its wall is thicker (D)that the right ventricle's.", "options": ["pumps", "to", "so", "that"], "answer": 3, "fix": "than", "explain_ko": "비교급 + than."}, {"type": "error", "sentence": "His heart rate (A)has fallen to about 70 beats per minute since he (B)was started on a beta-blocker last month, and he no longer (C)feels his heart to race (D)when he climbs stairs.", "options": ["has fallen", "was started", "feels his heart to race", "when"], "answer": 2, "fix": "feels his heart race (racing)", "explain_ko": "지각동사 feel + O + 원형/-ing (to 불가). since + 과거 시점 → 주절 현재완료는 맞음."}, {"type": "error", "sentence": "So severe (A)was the chest pain that he could not (B)to speak in full sentences. The paramedics gave him aspirin (C)to chew and (D)took him straight to the catheter laboratory.", "options": ["was", "to speak", "to chew", "took"], "answer": 1, "fix": "speak", "explain_ko": "조동사 could not + 동사원형. So + 형용사 문두 → be동사 도치(was the pain)는 맞음."}, {"type": "error", "sentence": "Smoking (A)is one of the main (B)cause of (C)heart disease (D)and lung cancer.", "options": ["is", "cause", "heart disease", "and"], "answer": 1, "fix": "causes", "explain_ko": "one of the + 복수."}, {"type": "listen_gap", "script": "Nurse: Now I'm going to listen to your chest. Take a deep breath in through your mouth, and out. Good. Again, breathe in, and out. Your breathing sounds clear. Now I'll check your pulse. It's seventy-two beats per minute and regular. Your temperature is thirty-six point eight degrees, which is normal.", "gap_text": "Take a deep ___(1)___ in through your mouth. Your breathing sounds ___(2)___. Your pulse is seventy-two beats per ___(3)___ and regular. Your temperature is ___(4)___.", "answers": ["breath", "clear", "minute", "normal"]}]}, {"id": "u6", "title": "Nervous System", "title_ko": "신경계", "vocab": [{"term": "neuron", "ko": "신경세포", "lay": "nerve cell", "example": "Neurons are organized into nerves."}, {"term": "axon / dendrite", "ko": "축삭 / 가지돌기", "lay": "sending / receiving branch", "example": "Nerves consist of axons and dendrites."}, {"term": "synapse", "ko": "시냅스", "lay": "gap between neurons", "example": "Neurotransmitters cross the synapse."}, {"term": "neurotransmitter", "ko": "신경전달물질", "lay": "chemical messenger", "example": "Neurotransmitters enable impulses to jump the synapse."}, {"term": "CNS / PNS", "ko": "중추 / 말초신경계", "lay": "brain and spinal cord / nerves outside them", "example": "Cranial nerves belong to the PNS."}, {"term": "afferent (sensory) nerve", "ko": "구심성(감각) 신경", "lay": "carries messages to the brain", "example": "Afferent nerves travel from receptors to the brain."}, {"term": "efferent (motor) nerve", "ko": "원심성(운동) 신경", "lay": "carries messages from the brain", "example": "Efferent nerves travel to a muscle or gland."}, {"term": "autonomic nervous system", "ko": "자율신경계", "lay": "controls involuntary actions", "example": "The autonomic system controls heart rate."}, {"term": "somatic nervous system", "ko": "체성신경계", "lay": "controls voluntary movement", "example": "The somatic system controls skeletal muscles."}, {"term": "cerebrum / cerebellum", "ko": "대뇌 / 소뇌", "lay": "thinking brain / balance brain", "example": "The cerebellum coordinates balance."}, {"term": "pons / medulla", "ko": "교뇌 / 연수", "lay": "parts of the bra
