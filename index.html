ou learning Vietnamese?", "a": "[Your answer, e.g. I take a weekly class and practise with my nurses.]"}]}, {"type": "speech", "kind": "topic", "topic": "Antibiotic requests", "prompt": "A patient with a viral cold demands antibiotics. What would you do?", "prep": 60, "time": 120, "outline": ["환자의 걱정·기대 탐색", "바이러스 → 항생제 무효 설명", "부작용·내성 설명", "증상 완화법 제시", "safety-netting: 언제 다시 와야 하는지"], "model": "First, I would try to understand why the patient wants antibiotics. Often they are worried about missing work, or in the past antibiotics seemed to help. I would ask, 'What are you most worried about?'\n\nThen I would explain, in simple words, that a cold is caused by a virus and that antibiotics only kill bacteria. They will not make the patient recover faster.\n\nI would also explain that antibiotics are not harmless. They can cause diarrhoea, rashes and allergic reactions, and every unnecessary course increases antibiotic resistance, which means the drugs may not work when the patient really needs them.\n\nInstead, I would offer practical help: rest, fluids, paracetamol for fever and pain, and honey or warm drinks for a sore throat. I would also tell the patient that a cold usually improves within seven to ten days, so they know what to expect.\n\nMost importantly, I would give safety-netting advice. I would ask them to come back if they develop difficulty breathing, chest pain, a high fever lasting more than three days, or if they are getting worse instead of better.\n\nIn my experience, when patients feel that their concerns have been taken seriously, most accept this advice.", "followups": [{"q": "The patient says another doctor always gives antibiotics. What do you say?", "a": "I would avoid criticising the other doctor and explain that guidelines have changed because we now understand the risks of resistance better."}, {"q": "When are antibiotics needed for a respiratory infection?", "a": "When there are signs of a bacterial infection, such as pneumonia, or a strep throat with high fever, swollen tonsils with pus and tender neck glands."}, {"q": "What is antimicrobial stewardship?", "a": "It is a coordinated programme in a hospital to make sure antibiotics are used only when needed, with the right drug, dose and duration."}]}, {"type": "speech", "kind": "topic", "topic": "Palliative care", "prompt": "What is palliative care, and when should it start?", "prep": 60, "time": 120, "outline": ["정의: 증상 + 심리·사회·영적 돌봄, 가족 포함", "오해: 임종 직전만이 아님", "시작 시점: 중증 질환 진단 시부터, 치료와 병행", "근거: 조기 완화의료 → 삶의 질 향상", "사전 돌봄 계획(DNR 등)"], "model": "Palliative care is specialised care for people with serious illnesses. Its aim is to improve quality of life by relieving symptoms such as pain, breathlessness and nausea, and by supporting the psychological, social and spiritual needs of both patients and their families.\n\nA common misunderstanding is that palliative care is only for the last few days of life. In fact, it can start at the time of diagnosis of a serious illness, such as advanced cancer, heart failure or chronic lung disease, and it can be given alongside treatments like chemotherapy.\n\nThere is good evidence for starting early. In a well-known study of patients with advanced lung cancer, those who received early palliative care had a better quality of life and less depression.\n\nPalliative care also includes advance care planning. This means talking with patients, while they are still able to decide, about their wishes, for example whether they would want resuscitation or prefer to die at home.\n\nIn Vietnam and in Korea, many families find these conversations difficult. However, I believe that discussing them early, gently and repeatedly allows patients to keep control over their own lives until the end.", "followups": [{"q": "Does morphine shorten life in dying patients?", "a": "When it is carefully adjusted to control symptoms, there is no good evidence that it shortens life. Fear of morphine often leads to patients suffering unnecessary pain."}, {"q": "How would you start a conversation about resuscitation?", "a": "I would ask what the patient understands about their illness and what matters most to them, and then explain honestly what resuscitation can and cannot achieve."}, {"q": "What is the difference between palliative care and euthanasia?", "a": "Palliative care aims to relieve suffering, not to end life. Euthanasia means deliberately ending a life, and it is not legal in Vietnam or Korea."}]}, {"type": "speech", "kind": "topic", "topic": "Doctor burnout", "prompt": "What causes burnout among doctors, and how can it be prevented?", "prep": 60, "time": 120, "outline": ["정의·징후: 정서적 소진, 냉소, 성취감 저하", "원인: 장시간·야간, 행정, 환자 수, 감정 부담", "결과: 의료 오류, 이직", "예방 — 개인: 수면, 운동, 동료 지지, 도움 요청", "예방 — 조직: 근무표, 행정 경감, 팀 문화"], "model": "Burnout is a state of emotional exhaustion caused by long-term stress at work. Doctors with burnout often feel tired all the time, become cynical or distant towards patients, and lose their sense of achievement.\n\nThere are many causes. Doctors often work long hours and night shifts, see a very large number of patients, and spend a lot of time on paperwork. They also carry a heavy emotional load, dealing with death, suffering and sometimes complaints or violence.\n\nBurnout is not only a personal problem. Burnt-out doctors make more medical errors, have less empathy, and are more likely to leave the profession, which makes staff shortages even worse.\n\nPrevention needs action at two levels. At the individual level, doctors should protect their sleep, exercise, keep up hobbies and relationships outside medicine, and talk to colleagues or seek professional help when they are struggling.\n\nHowever, the most important changes are organisational: safe working hours, enough staff, less unnecessary administration, and a culture in which asking for help is seen as a strength, not a weakness.\n\nPersonally, I try to exercise regularly and to talk through difficult cases with colleagues, which helps me a lot.", "followups": [{"q": "What would you do if a colleague seemed burnt out?", "a": "I would talk to them privately and kindly, listen, and encourage them to seek support. If patient safety were at risk, I would inform a senior."}, {"q": "Is burnout mainly an individual or a system problem?", "a": "Both, but mainly a system problem. Asking doctors to be more resilient without changing workloads will not solve it."}, {"q": "How do you manage stress?", "a": "[Your answer, e.g. I go running three times a week and I make sure I have one full day off.]"}]}, {"type": "speech", "kind": "topic", "topic": "Social media", "prompt": "Should doctors use social media? What are the risks?", "prep": 60, "time": 120, "outline": ["장점: 건강 교육, 잘못된 정보 바로잡기, 네트워킹", "위험 1: 비밀유지 위반 (익명화해도 식별 가능)", "위험 2: 환자와의 경계", "위험 3: 비전문적 게시물, 온라인 개별 진료", "원칙: 개인·전문 계정 분리, 공개·영구라고 가정"], "model": "Social media can be a powerful tool for doctors, but it must be used carefully.\n\nOn the positive side, doctors can use social media to share reliable health information, correct dangerous misinformation, for example about vaccines, and connect with colleagues around the world. During the COVID-19 pandemic, many doctors did this very effectively.\n\nHowever, there are important risks. The biggest one is breaching confidentiality. Even if a doctor removes a patient's name, a case can sometimes be identified from the date, the location or an unusual detail.\n\nThe second risk is unclear boundaries. If patients follow their doctor's personal account, the professional relationship can become confused.\n\nThird, unprofessional posts, such as complaining about patients or photos that look irresponsible, can damage public trust in the profession. Doctors should also avoid giving individual medical advice online without proper assessment.\n\nMy approach is simple. I keep my personal and professional accounts separate, I never post patient information without written consent, and I assume that anything I post is public and permanent.\n\nUsed responsibly, social media can help us reach far more people than we can see in the clinic.", "followups": [{"q": "A patient sends you a friend request. What do you do?", "a": "I would politely decline and, if appropriate, explain that I keep my personal account separate from my work."}, {"q": "Can you post clinical photos for teaching?", "a": "Only with the patient's explicit written consent, after removing anything that could identify them, and following hospital policy."}, {"q": "How would you respond to medical misinformation online?", "a": "Calmly and politely, with simple explanations and links to reliable sources, without attacking the person."}]}, {"type": "speech", "kind": "topic", "topic": "Health promotion", "prompt": "How important is health promotion in your daily practice?", "prep": 60, "time": 120, "outline": ["만성질환(NCD)이 베트남 사망 원인의 대부분", "매 진료 = 기회: 흡연·음주·염분·운동 질문", "짧은 조언(brief advice)의 효과", "동기강화 면담: 준비되지 않은 환자 존중", "결론: 예방이 가장 비용 효과적"], "model": "I think health promotion is one of the most important parts of my work.\n\nToday, the majority of deaths in Vietnam are caused by non-communicable diseases such as stroke, heart disease, cancer and diabetes. Many of these are linked to a few risk factors: smoking, alcohol, an unhealthy diet with too much salt, and physical inactivity. Smoking is still very common among Vietnamese men, and high blood pressure is often undiagnosed.\n\nBecause of this, I see every consultation as an opportunity. Even when a patient comes with a minor problem, I check their blood pressure and ask about smoking and alcohol. Research shows that even very brief advice from a doctor increases the chance that a smoker will try to quit.\n\nHowever, lecturing patients does not work. I try to use a motivational approach: I ask what they already know, what they might want to change, and what makes it difficult. Then we agree on one small, realistic goal, such as walking for twenty minutes after dinner.\n\nIf a patient is not ready to change, I respect that and leave the door open for the next visit.\n\nIn my view, prevention is the most cost-effective medicine we have.", "followups": [{"q": "A patient is not ready to quit smoking. What do you do?", "a": "I respect their decision, make sure they know the risks, and tell them that help is available whenever they are ready. I ask again at the next visit."}, {"q": "What single lifestyle change has the biggest health benefit?", "a": "For smokers, stopping smoking. It reduces the risk of heart disease, stroke, lung disease and many cancers."}, {"q": "How would you talk to a parent who is unsure about vaccinating their child?", "a": "I would listen to their specific worries without judging, give clear information about the benefits and the real risks, and give them time to decide."}]}, {"type": "speech", "kind": "topic", "topic": "Patients who cannot pay", "prompt": "Should doctors treat patients who cannot afford to pay?", "prep": 60, "time": 120, "outline": ["응급: 지불 능력과 무관하게 반드시 치료", "정의(justice) 원칙", "실천: 건강보험(BHYT) 확인, 사회복지·자선기금 연결", "비용 효과적 선택: 제네릭, 필수 검사", "개인이 아닌 제도의 책임"], "model": "In an emergency, the answer is clearly yes. A doctor must never refuse urgent, life-saving treatment because a patient cannot pay. This is both an ethical duty and, in most countries, a legal one.\n\nFor non-urgent care, the situation is more complex, but I still believe that doctors have a responsibility to help. One of the core principles of medical ethics is justice, which means that health care should be distributed fairly, not only to those who are rich.\n\nIn practice, there are several things I can do. First, I can check whether the patient has health insurance. In Vietnam, most people are covered by social health insurance, but some do not know how to use it. Second, I can involve the hospital social worker or a charity fund. Third, I can choose cost-effective options, such as generic medicines and only the tests th   [/\bmore (better|worse|easier|bigger|smaller|faster)\b/gi, '비교급 중복 → more 삭제'],

  [/\ban ([bcdfgjklmnpqrstvwyz]\w+)/gi, 'an → a (자음 앞)', m => !/^an (hour|honest|hono|mri|x|ecg|ekg|nsaid|sms)/i.test(m)],

const band = (v, cuts) => { let s = 1; cuts.forEach((c,k)=>{ if (v>=c) s = k+2; }); return s; };
function assess(text, st, e) {
  const t = text.toLowerCase().replace(/[’]/g,"'"), toks = t.match(/[a-z']+/g) || [], n = toks.length;
  const mins = Math.max(st.speech, 1)/60, wpm = Math.round(n/mins);
  // Fluency
  const ppm = st.pauses/Math.max(mins, 0.5);
  let flu = band(wpm, [60,80,95,110]); if (ppm>2) flu = Math.max(1, flu-1);
  const timeRatio = st.speech/e.time; if (timeRatio<0.6) flu = Math.min(flu, 2);
  // Vocabulary: moving-average type-token ratio over 50-word windows
  let mattr = 0; if (n>=50) { let sum=0, c=0; for (let i=0;i+50<=n;i+=5) { sum += new Set(toks.slice(i,i+50)).size/50; c++; } mattr = sum/c; } else mattr = n ? new Set(toks).size/n : 0;
  const content = new Set(toks.filter(w=>w.length>=5 && !STOP.has(w)));
  const modelWords = new Set((e.model.toLowerCase().match(/[a-z']+/g)||[]).filter(w=>w.length>=6 && !STOP.has(w)));
  const shared = [...content].filter(w=>modelWords.has(w));
  let voc = band(mattr, [0.6,0.66,0.72,0.78]); if (n<40) voc = Math.min(voc, 2); else if (n<100) voc = Math.min(voc, 4); // short samples inflate diversity
  // Grammar
  const errs = [];
  GERR.forEach(([re, fix, ok]) => { for (const m of t.matchAll(re)) if (!ok || ok(m[0])) errs.push({hit:m[0], fix}); });
  const per100 = n ? errs.length/(n/100) : 0, complex = (t.match(/\b(because|although|though|which|who|whose|when|if|unless|while|whereas|so that|in order to)\b/g)||[]).length;
  let gra = n ? 6 - band(per100, [0.5,1.5,3,5]) : 1; if (n && complex/(n/100) < 1) gra = Math.max(1, gra-1);
  // Task achievement: length + organisation
  const target = e.time/60*100, ratio = n/target, mk = MARKERS.filter(m=>new RegExp('\\b'+m+'\\b').test(t));
  const task = ratio>=0.85 && mk.length>=4 ? 5 : ratio>=0.7 && mk.length>=3 ? 4 : ratio>=0.5 && mk.length>=2 ? 3 : ratio>=0.3 ? 2 : 1;
  const sc = {flu, voc, gra, task}, avg = (flu+voc+gra+task)/4, pass = avg>=3 && Math.min(flu,voc,gra,task)>=2;
  return {n, wpm, ppm, timeRatio, mattr, shared, errs, complex, mk, sc, avg, pass};
}

"""
${text.trim()}
"""`;

async function transcribe(blob, e) {
  const item = S.items[S.i], alive = () => S.items[S.i]===item && $('#ast');
  const status = s => { if (alive()) $('#ast').textContent = s; };
  const btns = () => document.querySelectorAll('label[for="af"],#userec');
  btns().forEach(b=>b.style.pointerEvents='none');
  try {
    status('Reading audio…');
    const d = await decode16k(blob), st = audioStats(d);
    if (st.speech < 3) throw new Error('목소리가 거의 들리지 않습니다');
    status('Loading speech model…');
    const pipe = await getASR(p => { if (p.status==='progress' && p.total>1e6) status(`Downloading model — ${p.file.split('/').pop()} ${Math.round(p.progress)}%`); });
    status(`Transcribing ${fmt(Math.round(st.total))} of audio… (보통 음성 길이의 절반~비슷한 시간)`);
    const out = await pipe(d, {chunk_length_s:30, stride_length_s:5});
    if (!alive()) return;
    const text = (out.text||'').trim();
    status(text ? 'Done.' : '음성을 인식하지 못했습니다.');
    $('#aout').hidden = false; $('#tr').value = text;
    const run = () => showAssess(e, $('#tr').value, st);
    $('#rescore').onclick = run;
    $('#cpy').onclick = async () => { const p = claudePrompt(e, $('#tr').value, st), b = $('#cpy');
      try { await navigator.clipboard.writeText(p); b.textContent = 'Copied — paste into Claude'; }
      catch(err) { const ta = $('#tr'); const keep = ta.value; ta.value = p; ta.select(); document.execCommand('copy'); ta.value = keep; b.textContent = 'Copied'; } };
    run();
  } catch(err) {
    status('실패: '+(err && err.message || err)+(String(err).includes('fetch')||String(err).includes('import')?' — 인터넷 연결이 필요합니다 (첫 사용 시 모델 다운로드)':''));
  } finally { btns().forEach(b=>b.style.pointerEvents=''); }
}

      tip(a.sc.flu, [[a.timeRatio<0.6, `${fmt(e.time)} 중 최소 ${Math.round(e.time*0.75)}초는 말하세요 — 근거마다 예시 하나씩`], [a.wpm<95, '끊지 말고 이어 말하기: 문장을 짧게, 연결어로 잇기'], [a.ppm>2, '멈출 때 "Let me think…" 같은 표현으로 채우기']])],

      tip(a.sc.voc, [[a.n<100, '말한 양이 적어 어휘를 판단하기 어렵습니다 — 더 길게 말하기'], [a.sc.voc<4, '같은 단어 반복 줄이기 — 모범 스크립트의 표현(autonomy, consent 등)을 가져다 쓰기']])],

    <table class="atab">${rows.map(r=>`<tr><td><b class="cap">${r[0]}</b><br><span class="kr">${r[1]}</span></td><td class="dots5">${L5(r[2])}</td><td>${esc(r[3])}<br><span class="kr" style="color:var(--mute)">${esc(r[4])}</span></td></tr>`).join('')}</table>

    <p class="kr" style="font-size:12px;color:var(--mute);margin:14px 0 0">자동 추정치입니다. 음성인식(Whisper)은 문법 실수를 고쳐 적거나 "um"을 빼는 경향이 있어 문법·유창성 점수가 실제보다 후할 수 있습니다. 정확한 평가는 Copy for Claude를 눌러 Claude 대화창에 붙여넣으세요.</p>`;
}

function check() {
  S.checked = true; stopSpeak();

    right = S.sel===e.answer;

  $('#app').innerHTML = `<main class="gate" id="wel" role="button" tabindex="0" aria-label="계속"><div class="gin welcome">
    <p class="glogo">WARD</p>
    <h1>${returning ? 'Welcome back,' : 'Welcome,'}<br><span>${esc(store.name)}</span></h1>
    <p class="cap" style="color:#a8978a">${returning ? (st ? `${st} day streak — keep it going` : 'Let’s pick up where you left off') : 'Let’s start your first lesson'}</p>
  </div></main>`;
  let done = false; const nx = () => { if (done) return; done = true; home(); };
  $('#wel').onclick = nx; $('#wel').onkeydown = nx; setTimeout(nx, 1600);
}
gate();
}
