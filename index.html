instem", "example": "The pons helps to regulate breathing."}, {"term": "longitudinal fissure", "ko": "대뇌종렬", "lay": "groove between hemispheres", "example": "The cerebrum is divided into two hemispheres by the longitudinal fissure."}], "exercises": [{"type": "mcq", "q": "The ______ nervous system controls involuntary functions such as heart rate and digestion.", "options": ["somatic", "autonomic", "central", "voluntary"], "answer": 1, "explain_ko": "불수의 = autonomic."}, {"type": "mcq", "q": "There are ______ pairs of cranial nerves.", "options": ["ten", "twelve", "thirty-one", "eight"], "answer": 1, "explain_ko": "뇌신경 12쌍, 척수신경 31쌍."}, {"type": "mcq", "q": "All nerves, including the cranial nerves, are part of the ______.", "options": ["CNS", "PNS", "brainstem", "spinal cord"], "answer": 1, "explain_ko": "머리에 있어도 nerve는 전부 PNS."}, {"type": "mcq", "q": "Polymyositis is a type of muscle disease ______ an inflammatory myopathy.", "options": ["that called", "called", "is called", "which called"], "answer": 1, "explain_ko": "명사 + called (분사 후치수식) [g5]."}, {"type": "synonym", "sentence": "The function of [[motor nerves]] is to carry messages from the brain to a muscle or gland.", "options": ["afferent nerves", "efferent nerves", "sensory nerves", "mixed nerves"], "answer": 1, "explain_ko": "motor = efferent (Exit), sensory = afferent (Arrive)."}, {"type": "synonym", "sentence": "Neurotransmitters [[enable]] impulses to cross the synapse.", "options": ["allow", "prevent", "urge", "push"], "answer": 0, "explain_ko": "enable A to V = allow A to V."}, {"type": "error", "sentence": "The cerebrum (A)is divided (B)from two hemispheres, right and left, (C)by the longitudinal (D)fissure.", "options": ["is divided", "from", "by", "fissure"], "answer": 1, "fix": "into", "explain_ko": "divide into [g6]."}, {"type": "error", "sentence": "The pons helps (A)to ensure (B)that you (C)breath (D)smoothly.", "options": ["to ensure", "that", "breath", "smoothly"], "answer": 2, "fix": "breathe", "explain_ko": "동사 자리 → breathe [g7]."}, {"type": "error", "sentence": "Patients (A)suffer from neuropathy (B)may not feel pain (C)when they are injured, (D)increasing the risk of severe wounds.", "options": ["suffer", "may not feel", "when", "increasing"], "answer": 0, "fix": "suffering (= who suffer)", "explain_ko": "동사가 두 개(suffer, may not feel) → 앞을 분사/관계절로 [g5]."}, {"type": "listen_gap", "script": "Sensory nerves, also called afferent nerves, carry messages from sensory receptors to the brain. Motor nerves, or efferent nerves, carry messages from the brain to a muscle or a gland. Mixed nerves carry messages in both directions. In humans, there are twelve pairs of cranial nerves and thirty-one pairs of spinal nerves.", "gap_text": "Sensory nerves are also called ___(1)___ nerves. Motor nerves carry messages from the brain to a muscle or a ___(2)___. Mixed nerves carry messages in both ___(3)___. There are ___(4)___ pairs of cranial nerves.", "answers": ["afferent", "gland", "directions", "twelve"]}, {"type": "reading", "passage": "The nervous system has two main parts: the central nervous system (CNS), which consists of the brain and the spinal cord, and the peripheral nervous system (PNS), which includes all the nerves outside the CNS. The PNS is divided into the somatic nervous system, which controls voluntary movements of the skeletal muscles, and the autonomic nervous system, which controls involuntary functions such as heart rate, breathing and digestion. The autonomic system has two branches: the sympathetic system prepares the body for 'fight or flight', while the parasympathetic system helps the body 'rest and digest'.", "questions": [{"q": "What does the central nervous system consist of?", "model": "The central nervous system consists of the brain and the spinal cord."}, {"q": "What does the somatic nervous system control?", "model": "It controls voluntary movements of the skeletal muscles."}, {"q": "What is the role of the sympathetic system?", "model": "The sympathetic system prepares the body for 'fight or flight'."}]}, {"type": "mcq", "q": "The ______ coordinates balance and movement.", "options": ["cerebellum", "cerebrum", "medulla", "hypothalamus"], "answer": 0, "explain_ko": "소뇌 = 균형·협응."}, {"type": "mcq", "q": "Multiple sclerosis is a disease (A)[that / in which] the immune system attacks the myelin (B)[covers / covering] nerve fibres. As a result, messages (C)[travel / are travelled] more slowly along the affected nerves.", "options": ["that – covering – travel", "in which – covering – travel", "in which – covers – travel", "in which – covering – are travelled"], "answer": 1, "explain_ko": "(A) 뒤가 완전한 절 → in which. (B) 이미 동사 attacks 있음 → 분사 covering. (C) travel은 자동사 → 수동 불가."}, {"type": "mcq", "q": "The gap between two neurons is called a ______.", "options": ["synapse", "fissure", "ganglion", "plexus"], "answer": 0, "explain_ko": "시냅스."}, {"type": "mcq", "q": "______ nerves travel from sensory receptors to the brain.", "options": ["Afferent", "Efferent", "Motor", "Autonomic"], "answer": 0, "explain_ko": "Afferent = Arrive."}, {"type": "mcq", "q": "Patient: I've had this headache for three days and it's getting worse.\nDoctor: ______\nPatient: No, but bright light really bothers me, and my neck feels stiff.", "options": ["Do you drink a lot of coffee?", "Have you had any fever or vomiting?", "Did you sleep well last night?", "Which side of your head is it?"], "answer": 1, "explain_ko": "\"No, but ...\" → 예/아니오 위험신호 질문. 광과민 + 목 경직 = 수막자극 징후 → 응급 평가 필요."}, {"type": "mcq", "q": "The ______ is the largest part of the brain.", "options": ["cerebrum", "cerebellum", "pons", "thalamus"], "answer": 0, "explain_ko": "대뇌."}, {"type": "mcq", "q": "The patient was ______ after the seizure and did not know where he was.", "options": ["confusing", "confused", "confusion", "confusedly"], "answer": 1, "explain_ko": "사람이 혼란을 '느끼는' 상태 → confused. 발작 후 혼돈(postictal confusion)."}, {"type": "mcq", "q": "A ______ happens when the blood supply to part of the brain is cut off.", "options": ["stroke", "seizure", "migraine", "concussion"], "answer": 0, "explain_ko": "뇌졸중."}, {"type": "mcq", "q": "The sympathetic nervous system prepares the body for ______.", "options": ["fight or flight", "rest and digest", "sleep", "digestion"], "answer": 0, "explain_ko": "교감 = fight or flight."}, {"type": "mcq", "q": "If the patient had arrived at hospital earlier, he ______ thrombolysis.", "options": ["could have received", "could receive", "can receive", "had received"], "answer": 0, "explain_ko": "If + had p.p. → 주절 could/would have p.p. (가정법 과거완료)."}, {"type": "mcq", "q": "Loss of sensation in the feet is often caused by ______ neuropathy.", "options": ["diabetic", "hepatic", "pulmonary", "gastric"], "answer": 0, "explain_ko": "당뇨병성 신경병증."}, {"type": "synonym", "sentence": "[[Sensory]] nerves carry information to the brain.", "options": ["Afferent", "Efferent", "Motor", "Cranial"], "answer": 0, "explain_ko": "sensory = afferent."}, {"type": "synonym", "sentence": "She felt [[numbness]] in her fingers.", "options": ["loss of feeling", "sharp pain", "itching", "weakness"], "answer": 0, "explain_ko": "numbness = 감각 소실."}, {"type": "synonym", "sentence": "The patient had a [[seizure]] last night.", "options": ["convulsion", "faint", "stroke", "headache"], "answer": 0, "explain_ko": "seizure = convulsion."}, {"type": "synonym", "sentence": "Nerve cells [[relay]] messages to the brain.", "options": ["pass on", "block", "store", "create"], "answer": 0, "explain_ko": "relay = 전달하다."}, {"type": "synonym", "sentence": "Cranial nerves [[travel]] between the brain and other areas in the head.", "options": ["run", "jump", "stop", "grow"], "answer": 0, "explain_ko": "travel = run(주행하다)."}, {"type": "error", "sentence": "Patients with Parkinson's disease often find simple tasks such as buttoning a shirt (A)frustrated. Their movements become slow, and (B)many of them develop a tremor (C)that is most obvious (D)when the hand is at rest.", "options": ["frustrated", "many of them", "that", "when"], "answer": 0, "fix": "frustrating", "explain_ko": "find + O(tasks) + 보어: 일이 좌절감을 '주는' → frustrating. 파킨슨병 떨림은 안정 시 두드러짐."}, {"type": "error", "sentence": "The neurologist asked the patient (A)whether he had any weakness and then tested his reflexes (B)to find out (C)if the problem was in the brain or in the nerves. The next step depends on (D)if the symptoms affect one side.", "options": ["whether", "to find out", "if", "if"], "answer": 3, "fix": "whether", "explain_ko": "전치사(on) 뒤 명사절 → whether만 가능 (if 불가). 동사 뒤 목적어 자리는 if/whether 모두 가능."}, {"type": "error", "sentence": "Neurotransmitters (A)enable impulses (B)jumping (C)over (D)the synapse.", "options": ["enable", "jumping", "over", "the synapse"], "answer": 1, "fix": "to jump", "explain_ko": "enable A to V."}, {"type": "error", "sentence": "The autonomic nervous system controls organs (A)such as the heart, (B)whom we (C)cannot control (D)consciously.", "options": ["such as", "whom", "cannot control", "consciously"], "answer": 1, "fix": "which", "explain_ko": "사물 선행사 → which [g4]."}, {"type": "error", "sentence": "In a stroke, time is critical: the longer treatment is delayed, (A)the more brain cells die. That is why paramedics are trained (B)to recognise the signs quickly and (C)taking the patient (D)directly to a stroke centre.", "options": ["the more brain cells die", "to recognise", "taking", "directly"], "answer": 2, "fix": "(to) take", "explain_ko": "trained to recognise ... and (to) take → to부정사 병렬. the 비교급, the 비교급 구문은 맞음."}, {"type": "listen_tf", "script": "Doctor: Mr Hoang, you were brought in because your wife noticed that the left side of your face was drooping and your speech was slurred. These are signs of a stroke. The CT scan shows no bleeding in the brain, so we can give you a medicine to dissolve the clot. We need to start it within the next hour.", "statements": [{"s": "The right side of his face was drooping.", "answer": false}, {"s": "His speech was slurred.", "answer": true}, {"s": "The CT scan shows bleeding in the brain.", "answer": false}, {"s": "The medicine will dissolve the clot.", "answer": true}, {"s": "The treatment can wait until tomorrow.", "answer": false}]}]}, {"id": "u7", "title": "Reproduction & Development", "title_ko": "생식과 발생", "vocab": [{"term": "menarche", "ko": "초경", "lay": "first menstrual period", "example": "Menarche usually occurs between 10 and 15."}, {"term": "menopause", "ko": "폐경", "lay": "end of menstrual cycles", "example": "Menopause usually occurs between 45 and 55."}, {"term": "endometrium", "ko": "자궁내막", "lay": "lining of the uterus", "example": "The blastocyst implants in the endometrium."}, {"term": "ovum / sperm", "ko": "난자 / 정자", "lay": "egg cell / male sex cell", "example": "Fertilization occurs when a sperm meets an ovum."}, {"term": "zygote", "ko": "접합자", "lay": "fertilized egg", "example": "The zygote divides as it travels down the tube."}, {"term": "morula", "ko": "상실배", "lay": "solid ball of cells", "example": "By day 4 a morula has formed."}, {"term": "blastocyst", "ko": "포배", "lay": "hollow ball of cells", "example": "The blastocyst implants in the uterus."}, {"term": "embryo / fetus", "ko": "배아 / 태아", "lay": "weeks 3–8 / after week 8", "example": "After eight weeks the embryo is called a fetus."}, {"term": "placenta", "ko": "태반", "lay": "organ feeding the fetus", "example": "The placenta supplies oxygen and nutrients."}, {"term": "stem cell", "ko": "줄기세포", "lay": "unspecialized cell", "example": "Stem cells can differentiate into specialized cells."}, {"term": "semen", "ko": "정액", "lay": "fluid carrying sperm", "example": "The alkalinity of semen neutralizes vaginal acidity."}], "exercises": [{"type": "mcq", "q": "The ______ supplies oxygen and nutrients to the fetus and removes waste.", "options": ["morula", "placenta", "blastocyst", "endometrium"], "answer": 1, "explain_ko": "태반 = placenta."}, {"type": "mcq", "q": "The alkalinity of semen helps ______ the acidity of the vagina, ______ the lifespan of sperm.", "options": ["neutralizing / prolonging", "neutralize / prolong", "neutralize / prolonging", "neutralizing / prolong"], "answer": 2, "explain_ko": "help + 원형, 결과 분사구문 -ing [g9]."}, {"type": "mcq", "q": "Stem cells can differentiate ______ specialized cells.", "options": ["to", "into", "from", "with"], "answer": 1, "explain_ko": "differentiate into [g6]."}, {"type": "mcq", "q": "Which sequence is correct?", "options": ["zygote → blastocyst → morula → embryo", "morula → zygote → blastocyst → fetus", "zygote → morula → blastocyst → embryo → fetus", "embryo → zygote → morula → fetus"], "answer": 2, "explain_ko": "접합자 → 상실배 → 포배 → 배아 → 태아."}, {"type": "synonym", "sentence": "In women, [[the end of the menstrual cycle]] usually occurs between 45 and 55 years of age.", "options": ["menarche", "endometrium", "menopause", "morula"], "answer": 2, "explain_ko": "end = menopause / start = menarche."}, {"type": "synonym", "sentence": "Her [[first menstrual period]] occurred at the age of twelve.", "options": ["menopause", "menarche", "ovulation", "puberty"], "answer": 1, "explain_ko": "menarche = 초경."}, {"type": "error", "sentence": "After fertilization, the zygote (A)divides (B)repeated to form a solid ball of cells (C)called (D)a morula.", "options": ["divides", "repeated", "called", "a morula"], "answer": 1, "fix": "repeatedly", "explain_ko": "동사 divides 수식 → 부사 repeatedly [g7]."}, {"type": "listen_tf", "script": "Midwife: Good morning, Mrs Tran. You are twenty-eight weeks pregnant now. The baby's heartbeat is strong, about one hundred and forty beats per minute. Your blood sugar test was slightly high, so I'd like you to see the dietitian next week. Remember to come straight to the hospital if you notice any bleeding or if the baby is moving less than usual.", "statements": [{"s": "Mrs Tran is 28 weeks pregnant.", "answer": true}, {"s": "The baby's heartbeat is weak.", "answer": false}, {"s": "Her blood sugar test result was slightly high.", "answer": true}, {"s": "She will see the dietitian today.", "answer": false}, {"s": "She should come to hospital if the baby moves less than usual.", "answer": true}]}, {"type": "reading", "passage": "After fertilization, the zygote divides many times as it travels down the fallopian tube. By about day 4 it forms a solid ball of cells called a morula. The morula then develops a fluid-filled cavity and becomes a blastocyst, which implants in the endometrium, the lining of the uterus. From the third to the eighth week of development it is called an embryo; after that it is called a fetus. The placenta develops from tissues of both the embryo and the mother. It supplies oxygen and nutrients and removes waste products.", "questions": [{"q": "What is a morula?", "model": "A morula is a solid ball of cells that forms about four days after fertilization."}, {"q": "Where does the blastocyst implant?", "model": "The blastocyst implants in the endometrium, the lining of the uterus."}, {"q": "When is the developing baby called a fetus?", "model": "It is called a fetus after the eighth week of development."}]}, {"type": "mcq", "q": "Fertilization usually takes place in the ______.", "options": ["fallopian tube", "uterus", "ovary", "cervix"], "answer": 0, "explain_ko": "수정 = 난관(팽대부)."}, {"type": "mcq", "q": "The ______ produce eggs and the hormones oestrogen and progesterone.", "options": ["ovaries", "testes", "uterus", "placenta"], "answer": 0, "explain_ko": "난소."}, {"type": "mcq", "q": "The placenta not only (A)[supply / supplies] the fetus with oxygen and nutrients (B)[but also / and also] removes waste products. If it separates from the uterine wall before birth, the mother may bleed heavily, (C)[that / which] is an emergency.", "options": ["supplies – but also – that", "supply – but also – which", "supplies – and also – which", "supplies – but also – which"], "answer": 3, "explain_ko": "(A) 주어 The placenta(단수) → supplies. (B) not only A but also B. (C) 콤마 뒤 앞 절 전체 → which. (태반조기박리는 응급)"}, {"type": "mcq", "q": "The ______ cord connects the fetus to the placenta.", "options": ["umbilical", "spinal", "vocal", "spermatic"], "answer": 0, "explain_ko": "탯줄."}, {"type": "mcq", "q": "The lining of the uterus is called the ______.", "options": ["endometrium", "myometrium", "peritoneum", "placenta"], "answer": 0, "explain_ko": "자궁내막."}, {"type": "mcq", "q": "Midwife: When was the first day of your last period?\nPatient: ______", "options": ["It lasted about five days.", "Usually every 28 days.", "It was on the 3rd of March.", "Since I was thirteen."], "answer": 2, "explain_ko": "When was ~? → 날짜로 답. 마지막 월경 첫날(LMP)로 분만예정일을 계산."}, {"type": "mcq", "q": "A normal pregnancy lasts about ______ weeks.", "options": ["40", "30", "50", "20"], "answer": 0, "explain_ko": "LMP 기준 약 40주."}, {"type": "mcq", "q": "Folic acid taken before ______ reduces the risk of neural tube defects.", "options": ["conceive", "conception", "conceptional", "conceived"], "answer": 1, "explain_ko": "전치사 before 뒤 명사 자리 → conception(임신, 수태). 엽산은 임신 전부터 복용 권장."}, {"type": "mcq", "q": "Because the baby was in the breech position, the obstetrician recommended that the baby ______ by caesarean section.", "options": ["is delivered", "be delivered", "was delivered", "delivering"], "answer": 1, "explain_ko": "제안·권고 동사(recommend, suggest, insist) + that + (should) 동사원형 → be delivered."}, {"type": "mcq", "q": "A pregnant woman should come to hospital at once if she notices ______.", "options": ["vaginal bleeding", "mild tiredness", "a bigger appetite", "the baby kicking"], "answer": 0, "explain_ko": "질출혈 = 위험 징후."}, {"type": "mcq", "q": "A doctor who specializes in pregnancy and childbirth is a(n) ______.", "options": ["obstetrician", "pediatrician", "dermatologist", "cardiologist"], "answer": 0, "explain_ko": "산과의."}, {"type": "synonym", "sentence": "The baby was born [[before 37 weeks]].", "options": ["prematurely", "overdue", "stillborn", "by caesarean"], "answer": 0, "explain_ko": "37주 전 = premature."}, {"type": "synonym", "sentence": "She is [[expecting a baby]].", "options": ["pregnant", "in labour", "infertile", "breastfeeding"], "answer": 0, "explain_ko": "expecting = pregnant."}, {"type": "synonym", "sentence": "The [[womb]] enlarges during pregnancy.", "options": ["uterus", "ovary", "cervix", "vagina"], "answer": 0, "explain_ko": "womb = uterus."}, {"type": "synonym", "sentence": "The doctor checked the [[unborn baby]]'s heartbeat.", "options": ["fetus", "zygote", "embryo", "newborn"], "answer": 0, "explain_ko": "8주 이후 = fetus."}, {"type": "synonym", "sentence": "The blastocyst [[implants]] in the wall of the uterus.", "options": ["attaches itself", "divides", "dissolves", "travels"], "answer": 0, "explain_ko": "착상 = attach."}, {"type": "error", "sentence": "Rarely (A)do women experience serious complications during a normal pregnancy, but every pregnant woman (B)needs regular check-ups. (C)Measured her blood pressure at each visit helps doctors (D)detect pre-eclampsia early.", "options": ["do", "needs", "Measured", "detect"], "answer": 2, "fix": "Measuring", "explain_ko": "주어 자리 → 동명사 Measuring (동명사 주어는 단수 helps). Rarely 문두 도치 do는 맞음."}, {"type": "error", "sentence": "Many new mothers are not used to (A)wake up several times a night, so they may feel exhausted. Midwives encourage them (B)to rest (C)whenever the baby sleeps and (D)to accept help from family.", "options": ["wake", "to rest", "whenever", "to accept"], "answer": 0, "fix": "waking", "explain_ko": "be used to + -ing (~에 익숙하다). used to + 원형(과거 습관)과 구분."}, {"type": "error", "sentence": "The blastocyst (A)implants (B)to the endometrium (C)about a week (D)after fertilization.", "options": ["implants", "to", "about", "after"], "answer": 1, "fix": "in (into)", "explain_ko": "implant in/into."}, {"type": "error", "sentence": "Stem cells (A)can (B)differentiate (C)into (D)specialize cells.", "options": ["can", "differentiate", "into", "specialize"], "answer": 3, "fix": "specialized", "explain_ko": "명사 수식 → 과거분사 specialized."}, {"type": "error", "sentence": "Pregnant women (A)are advised (B)avoiding alcohol (C)because it (D)can harm the fetus.", "options": ["are advised", "avoiding", "because", "can harm"], "answer": 1, "fix": "to avoid", "explain_ko": "be advised to V."}, {"type": "listen_gap", "script": "Breastfeeding has many benefits. Breast milk contains antibodies that protect the baby against infections during the first months of life. It also provides all the nutrients a baby needs for about six months. For the mother, breastfeeding helps the uterus return to its normal size more quickly.", "gap_text": "Breast milk contains ___(1)___ that protect the baby against infections. It provides all the ___(2)___ a baby needs for about six months. Breastfeeding helps the ___(3)___ return to its normal size.", "answers": ["antibodies", "nutrients", "uterus"]}]}, {"id": "u8", "title": "Nursing & Clinical Communication", "title_ko": "병동·임상 의사소통", "vocab": [{"term": "admit / admission", "ko": "입원시키다 / 입원", "lay": "take into hospital", "example": "Have you ever admitted a patient before?"}, {"term": "discharge", "ko": "퇴원; 분비물", "lay": "send home; fluid from a wound", "example": "Check the wound for discharge."}, {"term": "refer / referral", "ko": "의뢰하다 / 의뢰", "lay": "send to a specialist", "example": "You are being referred to a cardiologist."}, {"term": "scales", "ko": "체중계", "lay": "used to weigh a patient", "example": "Please step on the scales."}, {"term": "pulse oximeter", "ko": "맥박산소측정기", "lay": "reads oxygen in the blood", "example": "I'll clip this oximeter onto your finger."}, {"term": "blood pressure cuff", "ko": "혈압계 커프", "lay": "band for measuring BP", "example": "Could you roll up your sleeve for the cuff?"}, {"term": "call bell", "ko": "호출벨", "lay": "button to call the nurse", "example": "Press the call bell if you need help."}, {"term": "incontinent", "ko": "실금의", "lay": "unable to control bladder/bowel", "example": "Incontinent patients may feel embarrassed."}, {"term": "bedpan / urinal / commode", "ko": "변기 / 소변기 / 이동식 변기", "lay": "toilet aids", "example": "I'll put the bedpan under you."}, {"term": "stabbing / throbbing / tingling / aching", "ko": "찌르는 / 욱신거리는 / 저릿한 / 쑤시는", "lay": "pain descriptors", "example": "It feels like a knife — a stabbing pain."}, {"term": "analgesia", "ko": "진통제(진통)", "lay": "pain relief", "example": "Analgesia can be given by mouth or injection."}, {"term": "on an empty stomach", "ko": "공복에", "lay": "before eating", "example": "Take this antibiotic on an empty stomach."}, {"term": "empathy vs sympathy", "ko": "공감 vs 동정", "lay": "understanding feelings vs feeling sorry", "example": "'You feel the treatment isn't helping' shows empathy."}, {"term": "palliative care / hospice", "ko": "완화의료 / 호스피스", "lay": "comfort care / end-of-life care", "example": "Hospice can be provided at home."}], "exercises": [{"type": "mcq", "q": "Could you ______ your sleeve, please? I need to check your blood pressure.", "options": ["take away", "roll up", "bend", "turn up"], "answer": 1, "explain_ko": "소매 걷기 = roll up."}, {"type": "mcq", "q": "The ______ shows the oxygen level in your blood.", "options": ["thermometer", "scales", "pulse oximeter", "blood pressure cuff"], "answer": 2, "explain_ko": "SpO2 = pulse oximeter."}, {"type": "mcq", "q": "He said it felt like a knife was stuck into him. This could be described as a(n) ______ pain.", "options": ["tingling", "throbbing", "stabbing", "aching"], "answer": 2, "explain_ko": "칼로 찌르는 = stabbing / 박동성 = throbbing / 저림 = tingling."}, {"type": "mcq", "q": "— ______? — It's a dull ache, about four out of ten.", "options": ["What's the pain like?", "What sets the pain off?", "What helps the pain?", "What do you take for the pain?"], "answer": 0, "explain_ko": "양상·강도 질문 = What's the pain like?"}, {"type": "mcq", "q": "'Take this antibiotic on an empty stomach' means ______.", "options": ["take it after meals", "take it with food", "take it before you eat", "take it at bedtime"], "answer": 2, "explain_ko": "공복 = 식전."}, {"type": "mcq", "q": "Your information may be passed to another hospital if you ______ for specialist treatment.", "options": ["are referring", "are being referred", "have referred", "refer"], "answer": 1, "explain_ko": "환자는 '의뢰되는' 대상 + 진행 → are being referred [g10]."}, {"type": "mcq", "q": "The nurse should check ______ the patient can walk to the bathroom.", "options": ["if", "that", "how", "when"], "answer": 0, "explain_ko": "확인 여부 = if/whether."}, {"type": "mcq", "q": "'It sounds like you're worried that the treatment isn't working.' The nurse says this to ______.", "options": ["show sympathy", "put up a barrier", "show empathy", "remove distractions"], "answer": 2, "explain_ko": "환자 감정을 되비춰 주기 = empathy."}, {"type": "synonym", "sentence": "The patient complained of [[pain]] in his muscles.", "options": ["hurt", "ache", "problem", "sickness"], "answer": 1, "explain_ko": "근육통 = muscle ache."}, {"type": "error", "sentence": "If you are (A)allergic (B)with penicillin, (C)you should (D)wear a red ID band.", "options": ["allergic", "with", "you should", "wear"], "answer": 1, "fix": "to", "explain_ko": "allergic to [g6]."}, {"type": "error", "sentence": "I'll come back (A)to ask you (B)some question (C)after your (D)lunch.", "options": ["to ask", "some question", "after your", "lunch"], "answer": 1, "fix": "some questions", "explain_ko": "some + 가산 복수 [g11]."}, {"type": "error", "sentence": "The patient fell (A)down the stairs and (B)broke her hip, (C)so she was (D)admitting to hospital.", "options": ["down", "broke", "so", "admitting"], "answer": 3, "fix": "admitted", "explain_ko": "환자는 입원'되는' 대상 → was admitted."}, {"type": "listen_gap", "script": "Nurse: Good afternoon. My name is Linh, and I'll be looking after you today. I just need to check a few details. Can you tell me your full name and date of birth? Patient: Robert Hughes, the fourth of March, nineteen fifty-eight. Nurse: Thank you. Do you have any allergies? Patient: Yes, I'm allergic to penicillin. Nurse: OK, I'll put a red band on your wrist. Now I'm going to take your temperature and blood pressure. Could you roll up your sleeve, please? And if you need anything, just press the call bell.", "gap_text": "The patient is allergic to ___(1)___. The nurse puts a red ___(2)___ on his wrist. She asks him to roll up his ___(3)___. If he needs anything, he should press the call ___(4)___.", "answers": ["penicillin", "band", "sleeve", "bell"]}, {"type": "reading", "passage": "Palliative care is specialised medical care for people with a serious illness. Its aim is to relieve pain and other symptoms and to improve the quality of life of both the patient and the family. It can be given at any stage of illness, together with treatment that aims to cure. Hospice care is a type of palliative care for people who are expected to live six months or less and who have decided to stop curative treatment. Hospice care can be provided at home, in a nursing home or in hospital. Choosing hospice is not a permanent decision: a patient can leave hospice to restart treatment and re-enroll later.", "questions": [{"q": "What is the aim of palliative care?", "model": "Its aim is to relieve pain and other symptoms and to improve the quality of life of the patient and the family."}, {"q": "Who is hospice care for?", "model": "Hospice care is for people who are expected to live six months or less and who have decided to stop curative treatment."}, {"q": "Where can hospice care be provided?", "model": "It can be provided at home, in a nursing home or in hospital."}]}, {"type": "mcq", "q": "Please step onto the ______ so that I can check your weight.", "options": ["scales", "thermometer", "oximeter", "cuff"], "answer": 0, "explain_ko": "체중계 = scales (복수형)."}, {"type": "mcq", "q": "A ______ is used to measure body temperature.", "options": ["thermometer", "stethoscope", "sphygmomanometer", "glucometer"], "answer": 0, "explain_ko": "체온계."}, {"type": "mcq", "q": "Have you ever ______ a patient to the ward before?", "options": ["admitted", "admit", "admitting", "to admit"], "answer": 0, "explain_ko": "현재완료 have + p.p."}, {"type": "mcq", "q": "Pay close attention to the ______, a liquid which comes out of a wound.", "options": ["discharge", "sutures", "odour", "dressing"], "answer": 0, "explain_ko": "discharge = 분비물."}, {"type": "mcq", "q": "A tingling pain feels like ______.", "options": ["pins and needles", "a knife", "a heartbeat", "a heavy weight"], "answer": 0, "explain_ko": "저릿함 = pins and needles."}, {"type": "mcq", "q": "A throbbing pain ______.", "options": ["beats like a pulse", "feels like a knife", "feels like pins and needles", "is always mild"], "answer": 0, "explain_ko": "throb = 박동."}, {"type": "mcq", "q": "— What sets the pain off? — ______", "options": ["It starts when I climb the stairs.", "It's about six out of ten.", "I take paracetamol.", "It's a sharp pain."], "answer": 0, "explain_ko": "유발 요인 질문."}, {"type": "mcq", "q": "Analgesia is medicine that ______ pain.", "options": ["relieves", "causes", "increases", "measures"], "answer": 0, "explain_ko": "진통 = relieve pain."}, {"type": "mcq", "q": "'Nil by mouth' means that the patient ______.", "options": ["must not eat or drink", "must take medicine orally", "can eat normally", "needs mouth care"], "answer": 0, "explain_ko": "NPO = 금식."}, {"type": "mcq", "q": "Before helping a patient onto the bedpan, the nurse closes the curtains to ______ privacy.", "options": ["ensure", "lose", "break", "avoid"], "answer": 0, "explain_ko": "ensure privacy."}, {"type": "mcq", "q": "Hospital staff must keep patients' records ______.", "options": ["confidential", "confident", "confidence", "confidentially"], "answer": 0, "explain_ko": "keep + 목적어 + 형용사."}, {"type": "mcq", "q": "Take this tablet ______ a day, after meals.", "options": ["twice", "two times of", "second", "double"], "answer": 0, "explain_ko": "하루 두 번 = twice a day."}, {"type": "synonym", "sentence": "The doctor will [[discharge]] you tomorrow.", "options": ["send you home", "admit you", "examine you", "refer you"], "answer": 0, "explain_ko": "discharge = 퇴원시키다."}, {"type": "synonym", "sentence": "Take two tablets [[orally]].", "options": ["by mouth", "by injection", "under the tongue", "with water"], "answer": 0, "explain_ko": "orally = by mouth (PO)."}, {"type": "synonym", "sentence": "We need a [[stool]] sample.", "options": ["faeces", "urine", "blood", "saliva"], "answer": 0, "explain_ko": "stool = faeces."}, {"type": "synonym", "sentence": "Do you [[pass water]] often at night?", "options": ["urinate", "sweat", "drink", "cough"], "answer": 0, "explain_ko": "pass water = urinate."}, {"type": "synonym", "sentence": "She becomes [[short of breath]] after walking.", "options": ["breathless", "dizzy", "nauseous", "exhausted"], "answer": 0, "explain_ko": "short of breath = breathless."}, {"type": "error", "sentence": "Before the operation, you will need to have your blood (A)test and sign a consent form. Please do not eat anything (B)after midnight, and remember (C)to bring a list of the medicines (D)you are taking.", "options": ["test", "after", "to bring", "you are taking"], "answer": 0, "fix": "tested", "explain_ko": "have + 사물 + p.p. (피가 '검사되는' 것) → tested. remember to V(앞으로 할 일)는 맞음."}, {"type": "error", "sentence": "Mr Park, I will just (A)clip this oximeter (B)into your (C)finger (D)to check your oxygen.", "options": ["clip", "into", "finger", "to check"], "answer": 1, "fix": "onto", "explain_ko": "손가락 '위에' 끼우다 → onto."}, {"type": "error", "sentence": "Please (A)let me know (B)if you (C)will need (D)anything.", "options": ["let me know", "if", "will need", "anything"], "answer": 2, "fix": "need", "explain_ko": "조건 부사절은 현재형."}, {"type": "error", "sentence": "You (A)mustn't (B)eat or drink (C)nothing (D)after midnight.", "options": ["mustn't", "eat or drink", "nothing", "after"], "answer": 2, "fix": "anything", "explain_ko": "부정문 + anything (이중부정 금지)."}, {"type": "error", "sentence": "Mr Hai started (A)walking every day after his heart attack, and he stopped (B)to smoke completely. He regrets (C)not giving up earlier and is looking forward to (D)returning to work.", "options": ["walking", "to smoke", "not giving up", "returning"], "answer": 1, "fix": "smoking", "explain_ko": "stop + -ing = ~을 그만두다 (stop to V = ~하려고 멈추다). look forward to + -ing."}, {"type": "listen_tf", "script": "Nurse: Mr Davies, it's time for your medication. This is your painkiller, paracetamol, one gram. And this is your antibiotic. You need to take the antibiotic every eight hours until the course is finished, even if you feel better. Have you had any side effects, such as diarrhoea or a rash? Patient: No, nothing like that. Nurse: Good. Ring the bell if you feel any pain later.", "statements": [{"s": "The painkiller is ibuprofen.", "answer": false}, {"s": "The antibiotic is taken every eight hours.", "answer": true}, {"s": "He can stop the antibiotic when he feels better.", "answer": false}, {"s": "He has not had any side effects.", "answer": true}, {"s": "He should ring the bell if he feels pain later.", "answer": true}]}]}, {"id": "u9", "title": "Writing Lab", "title_ko": "쓰기 실전 — 문장전환·편지·에세이", "vocab": [{"term": "I am writing to ...", "ko": "~하려고 편지를 드립니다", "lay": "letter opening — purpose", "example": "I am writing to give you some advice after your visit today."}, {"term": "As we discussed, ...", "ko": "말씀드렸듯이", "lay": "link to the consultation", "example": "As we discussed, your blood test shows that you have diabetes."}, {"term": "Please make sure (that) ...", "ko": "꼭 ~하세요", "lay": "polite instruction", "example": "Please make sure that you take the tablets with food."}, {"term": "Try to avoid ...", "ko": "~을 피하도록 하세요", "lay": "lifestyle advice + -ing / noun", "example": "Try to avoid salty food such as instant noodles."}, {"term": "Seek medical help immediately if ...", "ko": "~하면 즉시 병원에 오세요", "lay": "warning signs", "example": "Seek medical help immediately if you develop chest pain."}, {"term": "Please do not hesitate to contact me", "ko": "언제든 연락 주세요", "lay": "letter closing", "example": "If you have any questions, please do not hesitate to contact me."}, {"term": "Yours sincerely", "ko": "(이름을 알 때) 맺음말", "lay": "formal sign-off", "example": "Yours sincerely, Dr Kim"}, {"term": "On the one hand ... On the other hand ...", "ko": "한편으로는 … 다른 한편으로는 …", "lay": "essay — both views", "example": "On the one hand, prevention is cheap. On the other hand, treatment is urgent."}, {"term": "In my view / I firmly believe that ...", "ko": "제 생각에는", "lay": "essay — opinion", "example": "In my view, doctors should tell patients the truth."}, {"term": "Moreover / Furthermore", "ko": "게다가", "lay": "adding a point", "example": "Moreover, patients lose trust when the truth is hidden."}, {"term": "Nevertheless / However", "ko": "그럼에도 / 그러나", "lay": "contrast", "example": "Nevertheless, treatment services must not be neglected."}, {"term": "In conclusion, ...", "ko": "결론적으로", "lay": "essay ending", "example": "In conclusion, honesty should be the rule."}], "exercises": [{"type": "keyword", "sentence": "The doctor told the patient to stop smoking.", "keyword": "ADVISED", "stem": "The doctor ______ smoking.", "answers": ["advised the patient to stop", "advised him to stop", "advised her to stop", "advised them to stop"], "explain_ko": "advise + 목적어 + to부정사."}, {"type": "keyword", "sentence": "It is not necessary for you to fast before this blood test.", "keyword": "NEED", "stem": "You ______ before this blood test.", "answers": ["do not need to fast", "need not fast"], "explain_ko": "불필요 = don't need to / needn't + 동사원형."}, {"type": "keyword", "sentence": "The nurse took the patient's blood pressure every four hours.", "keyword": "TAKEN", "stem": "The patient's blood pressure ______ every four hours.", "answers": ["was taken by the nurse", "was taken"], "explain_ko": "능동 → 수동: 과거 수동 was taken (by + 행위자)."}, {"type": "keyword", "sentence": "If you don't take the antibiotics regularly, the infection will come back.", "keyword": "UNLESS", "stem": "The infection will come back ______ the antibiotics regularly.", "answers": ["unless you take"], "explain_ko": "unless = if ... not. unless 뒤에는 긍정문."}, {"type": "keyword", "sentence": "Although she had a high fever, she came to work.", "keyword": "DESPITE", "stem": "______ a high fever, she came to work.", "answers": ["despite having", "despite her having"], "explain_ko": "despite + 명사/동명사. despite of는 틀림."}, {"type": "keyword", "sentence": "The wound was so deep that it needed stitches.", "keyword": "SUCH", "stem": "It was ______ that it needed stitches.", "answers": ["such a deep wound"], "explain_ko": "so + 형용사 = such + a + 형용사 + 명사."}, {"type": "keyword", "sentence": "The patient is too weak to walk without help.", "keyword": "ENOUGH", "stem": "The patient is not ______ without help.", "answers": ["strong enough to walk"], "explain_ko": "too weak to = not strong enough to (enough는 형용사 뒤)."}, {"type": "keyword", "sentence": "I haven't had a cigarette for two years.", "keyword": "STOPPED", "stem": "I ______ two years ago.", "answers": ["stopped smoking", "stopped smoking cigarettes"], "explain_ko": "현재완료 for 기간 ↔ 과거 + ago. stop + -ing = ~을 끊다 (stop to smoke는 '피우려고 멈추다')."}, {"type": "keyword", "sentence": "'Take this tablet after meals,' the pharmacist said to me.", "keyword": "TOLD", "stem": "The pharmacist ______ that tablet after meals.", "answers": ["told me to take"], "explain_ko": "명령문 간접화법: tell + 목적어 + to부정사. this → that."}, {"type": "keyword", "sentence": "It's possible that the rash is an allergic reaction.", "keyword": "MIGHT", "stem": "The rash ______ an allergic reaction.", "answers": ["might be"], "explain_ko": "It's possible that = might/may/could."}, {"type": "keyword", "sentence": "Someone should check the patient's blood sugar before lunch.", "keyword": "CHECKED", "stem": "The patient's blood sugar ______ before lunch.", "answers": ["should be checked"], "explain_ko": "조동사 수동태: should + be + p.p."}, {"type": "keyword", "sentence": "The surgeon started the operation at 9 a.m. and is still operating.", "keyword": "BEEN", "stem": "The surgeon ______ since 9 a.m.", "answers": ["has been operating"], "explain_ko": "과거 시작 + 지금도 계속 = 현재완료진행."}, {"type": "keyword", "sentence": "Patients must not eat anything after midnight.", "keyword": "ALLOWED", "stem": "Patients ______ anything after midnight.", "answers": ["are not allowed to eat"], "explain_ko": "must not = be not allowed to."}, {"type": "keyword", "sentence": "Mr Lee was admitted two days ago.", "keyword": "SINCE", "stem": "It is two days ______ admitted.", "answers": ["since Mr Lee was", "since he was"], "explain_ko": "It is + 기간 + since + 과거."}, {"type": "keyword", "sentence": "We got the lab to repeat the potassium test.", "keyword": "HAD", "stem": "We ______ repeated by the lab.", "answers": ["had the potassium test", "had the test"], "explain_ko": "사역 수동: have + 사물 + p.p."}, {"type": "keyword", "sentence": "Regular exercise lowers the risk of heart disease.", "keyword": "REDUCED", "stem": "The risk of heart disease ______ regular exercise.", "answers": ["is reduced by"], "explain_ko": "lower = reduce. 현재 수동 is reduced by."}, {"type": "keyword", "sentence": "The pain was so bad that she couldn't sleep.", "keyword": "PREVENTED", "stem": "The pain ______ sleeping.", "answers": ["prevented her from"], "explain_ko": "prevent + 목적어 + from + -ing."}, {"type": "keyword", "sentence": "I'm sorry I didn't tell you about the side effects earlier.", "keyword": "SHOULD", "stem": "I ______ you about the side effects earlier.", "answers": ["should have told"], "explain_ko": "과거 후회 = should have + p.p."}, {"type": "keyword", "sentence": "The bone is weaker than it was a year ago.", "keyword": "AS", "stem": "The bone is not ______ it was a year ago.", "answers": ["as strong as"], "explain_ko": "비교급 ↔ not as + 원급 + as."}, {"type": "keyword", "sentence": "Doctors think that stress causes many headaches.", "keyword": "THOUGHT", "stem": "Stress ______ many headaches.", "answers": ["is thought to cause"], "explain_ko": "People think that S V = S is thought to V."}, {"type": "keyword", "sentence": "The doctor may ask for your medication list, so bring it.", "keyword": "CASE", "stem": "Bring your medication list ______ for it.", "answers": ["in case the doctor asks"], "explain_ko": "in case + 현재 = ~할 경우에 대비해 (will 쓰지 않음)."}, {"type": "keyword", "sentence": "As soon as the patient arrived, the nurse checked her vital signs.", "keyword": "SOONER", "stem": "No ______ arrived than the nurse checked her vital signs.", "answers": ["sooner had the patient", "sooner had she"], "explain_ko": "No sooner + had + S + p.p. + than (도치)."}, {"type": "keyword", "sentence": "The tablets are not effective unless you take them with food.", "keyword": "ONLY", "stem": "The tablets are effective ______ them with food.", "answers": ["only if you take"], "explain_ko": "not ... unless = only if."}, {"type": "keyword", "sentence": "It isn't worth taking antibiotics for a common cold.", "keyword": "POINT", "stem": "There is ______ antibiotics for a common cold.", "answers": ["no point in taking", "no point taking"], "explain_ko": "It's not worth -ing = There's no point (in) -ing. 감기는 바이러스성이라 항생제 무효."}, {"type": "keyword", "sentence": "The dressing needs changing every day.", "keyword": "CHANGED", "stem": "The dressing needs ______ every day.", "answers": ["to be changed"], "explain_ko": "need + -ing (수동 의미) = need to be + p.p."}, {"type": "keyword", "sentence": "She regrets not getting vaccinated.", "keyword": "WISHES", "stem": "She ______ vaccinated.", "answers": ["wishes she had got", "wishes she had been", "wishes she had gotten"], "explain_ko": "과거 후회 = wish + 과거완료."}, {"type": "keyword", "sentence": "The patient was given a sedative so that he would not panic during the scan.", "keyword": "AVOID", "stem": "The patient was given a sedative ______ during the scan.", "answers": ["to avoid panicking", "in order to avoid panicking", "to avoid a panic attack"], "explain_ko": "so that ... not = to avoid + -ing (avoid 뒤 동명사)."}, {"type": "keyword", "sentence": "Mrs Tran used to smoke 20 cigarettes a day, but she doesn't now.", "keyword": "LONGER", "stem": "Mrs Tran ______ 20 cigarettes a day.", "answers": ["no longer smokes", "does not smoke any longer"], "explain_ko": "used to (지금은 아님) = no longer + 현재 / not ... any longer."}, {"type": "keyword", "sentence": "Who referred you to this clinic?", "keyword": "BY", "stem": "Who ______ to this clinic?", "answers": ["were you referred by"], "explain_ko": "의문문 수동태: Who + be + S + p.p. + by?"}, {"type": "keyword", "sentence": "A cast is unnecessary because the X-ray showed no fracture.", "keyword": "HAVE", "stem": "The patient ______ a cast because the X-ray showed no fracture.", "answers": ["does not have to wear", "does not have to have"], "explain_ko": "불필요 = don't have to (must not '금지'와 구별)."}, {"type": "letter", "prompt": "Mr Nam, 52, has just been diagnosed with high blood pressure (158/96 mmHg). Write him a letter giving advice.", "points": ["diet and salt", "physical activity", "alcohol and smoking", "medication and home blood pressure checks", "follow-up appointment"], "model": "Dear Mr Nam,\n\nI am writing to give you some advice after your visit today. Your blood pressure was 158/96, which is high. If it is not controlled, it can damage your heart, kidneys and brain over time.\n\nFirst, please eat less salt: no more than one teaspoon (5 g) a day. Avoid instant noodles, fish sauce and processed meat, and eat more vegetables and fruit. Second, try to do 30 minutes of brisk walking on at least five days a week. Third, please stop smoking and keep alcohol to a minimum.\n\nTake your amlodipine tablet once every morning, even when you feel well. Check your blood pressure at home twice a day and write the numbers down. If you get a severe headache, chest pain or weakness on one side of your body, go to the emergency department immediately.\n\nPlease come back in four weeks with your blood pressure diary.\n\nYours sincerely,\nDr Kim", "checklist": ["인사(Dear ...)와 첫 문장에 편지 목적을 밝혔다", "제시된 조언 항목을 모두 다뤘다", "수치·빈도를 구체적으로 썼다 (예: 하루 5 g, 주 150분)", "의학용어는 쉬운 말로 풀었다 (환자가 읽는 글)", "언제 바로 병원에 와야 하는지(경고 증상) 썼다", "다음 진료·연락 방법을 안내했다", "공손한 맺음말과 서명(Yours sincerely, Dr ...)으로 끝냈다", "약 150단어 (120–200)"]}, {"type": "letter", "prompt": "Mrs Hoa, 47, has type 2 diabetes (HbA1c 8.2%). She is starting metformin. Write her a letter giving advice.", "points": ["what diabetes means", "diet", "exercise", "how to take metformin and its side effects", "foot care", "follow-up blood test"], "model": "Dear Mrs Hoa,\n\nThank you for coming to the clinic today. As we discussed, your blood test shows that you have type 2 diabetes. This means your body cannot control the sugar level in your blood properly.\n\nPlease eat regular meals with smaller portions of rice, and choose vegetables, fish, tofu and beans. Avoid sweet drinks and desserts. Walking for 30 minutes a day will also lower your blood sugar.\n\nTake one metformin tablet twice a day with your breakfast and dinner. At first it may cause stomach upset or diarrhoea, but this usually improves after a few weeks. Please tell me if it does not.\n\nDiabetes can reduce feeling in your feet, so check them every day for cuts or blisters and always wear shoes.\n\nWe will repeat your blood test in three months to see how well your sugar is controlled.\n\nYours sincerely,\nDr Kim", "checklist": ["인사(Dear ...)와 첫 문장에 편지 목적을 밝혔다", "제시된 조언 항목을 모두 다뤘다", "수치·빈도를 구체적으로 썼다 (예: 하루 5 g, 주 150분)", "의학용어는 쉬운 말로 풀었다 (환자가 읽는 글)", "언제 바로 병원에 와야 하는지(경고 증상) 썼다", "다음 진료·연락 방법을 안내했다", "공손한 맺음말과 서명(Yours sincerely, Dr ...)으로 끝냈다", "약 150단어 (120–200)"]}, {"type": "letter", "prompt": "Mr Tuan, 30, is going home two days after a laparoscopic appendicectomy. Write him a letter giving advice.", "points": ["wound care and showering", "pain relief", "activity and lifting", "warning signs", "stitch removal / clinic visit"], "model": "Dear Mr Tuan,\n\nYour operation to remove your appendix went well, and you are now ready to go home. I am writing to explain how to look after yourself during your recovery.\n\nYou may shower from tomorrow, but do not soak in a bath for two weeks. Pat the small wounds dry and keep the dressings clean. For pain, take two paracetamol tablets every six hours if needed, but no more than eight tablets in 24 hours.\n\nWalk a little several times a day, as this helps to prevent blood clots. However, please do not lift anything heavy or play sport for about two weeks.\n\nCome back to the hospital at once if you develop a fever, increasing pain in your abdomen, vomiting, or redness and pus around the wounds.\n\nPlease visit the surgical clinic in seven to ten days so that we can check your wounds.\n\nYours sincerely,\nDr Kim", "checklist": ["인사(Dear ...)와 첫 문장에 편지 목적을 밝혔다", "제시된 조언 항목을 모두 다뤘다", "수치·빈도를 구체적으로 썼다 (예: 하루 5 g, 주 150분)", "의학용어는 쉬운 말로 풀었다 (환자가 읽는 글)", "언제 바로 병원에 와야 하는지(경고 증상) 썼다", "다음 진료·연락 방법을 안내했다", "공손한 맺음말과 서명(Yours sincerely, Dr ...)으로 끝냈다", "약 150단어 (120–200)"]}, {"type": "letter", "prompt": "Linh, 19, a university student, has been diagnosed with asthma and has been given two inhalers. Write her a letter giving advice.", "points": ["what the two inhalers do", "inhaler technique", "triggers to avoid", "emergency signs", "review appointment"], "model": "Dear Linh,\n\nI am writing to remind you of what we discussed about your asthma. Asthma makes the airways in your lungs narrow and swollen, which causes coughing, wheezing and shortness of breath.\n\nYou have two inhalers. Use the brown preventer inhaler twice a day, every day, even when you feel well, because it reduces the swelling in your airways. Use the blue reliever inhaler only when you have symptoms. Always use the spacer, and rinse your mouth after the brown inhaler.\n\nTry to avoid things that make your asthma worse, such as cigarette smoke, dust and cold air. Please do not smoke.\n\nCall an ambulance if your reliever does not help, if you cannot speak in full sentences, or if your lips turn blue.\n\nPlease come back in six weeks so that we can check your inhaler technique.\n\nYours sincerely,\nDr Kim", "checklist": ["인사(Dear ...)와 첫 문장에 편지 목적을 밝혔다", "제시된 조언 항목을 모두 다뤘다", "수치·빈도를 구체적으로 썼다 (예: 하루 5 g, 주 150분)", "의학용어는 쉬운 말로 풀었다 (환자가 읽는 글)", "언제 바로 병원에 와야 하는지(경고 증상) 썼다", "다음 진료·연락 방법을 안내했다", "공손한 맺음말과 서명(Yours sincerely, Dr ...)으로 끝냈다", "약 150단어 (120–200)"]}, {"type": "essay", "prompt": "Some people believe that doctors should always tell patients the whole truth about a serious diagnosis. Others think that doctors should sometimes hide bad news to protect the patient. Discuss both views and give your own opinion.", "model": "Whether doctors should always reveal a serious diagnosis is a difficult question in medical ethics. While some argue that hiding bad news can protect vulnerable patients, I believe that honesty should be the rule, although the truth must be delivered with care.\n\nOn the one hand, there are reasons why some doctors and families prefer to keep information from a patient. In many Asian cultures, relatives ask the doctor not to tell an elderly parent about cancer because they fear the news will cause depression or loss of hope. A patient who is already very weak may also find it hard to cope with too much information at once.\n\nOn the other hand, patients have a right to know about their own bodies. Without accurate information, they cannot give informed consent to surgery or chemotherapy, nor can they make personal decisions about their finances, their families and the end of their lives. Moreover, when patients later discover that the truth was hidden, they often lose trust in their doctors, which damages the therapeutic relationship.\n\nIn my view, the solution is not to hide the truth but to tell it in a sensitive way. Doctors can ask how much the patient wants to know, give information step by step, and offer support from nurses, counsellors and family members.\n\nIn conclusion, although the wish to protect patients is understandable, honest communication respects their autonomy and maintains trust. Doctors should therefore tell the truth, but with compassion and at a pace the patient can accept.", "checklist": ["서론 마지막 문장에 내 입장(thesis)이 분명하다", "본론 문단마다 주제문 + 근거 + 구체적 예시가 있다", "반대 의견을 인정하고 반박했다", "연결어를 다양하게 썼다 (However, Moreover, As a result ...)", "결론에서 입장을 다시 정리했다 (새 논점 없음)", "축약형·구어체 없이 격식체로 썼다", "250단어 이상"]}, {"type": "essay", "prompt": "Governments should spend more money on preventing disease than on treating it. To what extent do you agree or disagree?", "model": "Health budgets are limited in every country, so governments must decide how to divide money between prevention and treatment. I largely agree that prevention deserves a greater share, although treatment services must never be neglected.\n\nThe main argument for prevention is that it is cost-effective. Vaccination programmes, for example, have almost eliminated diseases such as polio and measles in many countries at a fraction of the cost of treating them. Similarly, campaigns to reduce smoking and salt intake lower the number of heart attacks and strokes, which are extremely expensive to treat in hospital. Prevention also improves quality of life, because people stay healthy and continue working instead of suffering from long-term illness.\n\nHowever, it would be wrong to reduce funding for treatment. Some diseases, such as many childhood cancers, cannot be prevented with current knowledge. In addition, people who are already ill need hospitals, medicines and trained staff today, and they cannot wait for the long-term benefits of public health campaigns. For example, a patient who is having a heart attack needs emergency treatment immediately, not a leaflet about healthy eating. A government that ignored such patients would fail in its basic duty to its citizens.\n\nTherefore, the best approach is to increase investment in prevention gradually while protecting essential treatment services. Money saved from fewer hospital admissions can then be reinvested in both areas.\n\nIn conclusion, I agree that prevention should receive more funding because it saves lives and money in the long term. Nevertheless, a balanced health system must continue to provide good treatment for those who are already sick.", "checklist": ["서론 마지막 문장에 내 입장(thesis)이 분명하다", "본론 문단마다 주제문 + 근거 + 구체적 예시가 있다", "반대 의견을 인정하고 반박했다", "연결어를 다양하게 썼다 (However, Moreover, As a result ...)", "결론에서 입장을 다시 정리했다 (새 논점 없음)", "축약형·구어체 없이 격식체로 썼다", "250단어 이상"]}, {"type": "essay", "prompt": "Telemedicine, in which patients consult doctors by video call, is becoming more common. Do the advantages of this development outweigh the disadvantages?", "model": "Since the COVID-19 pandemic, video consultations have become a normal part of health care in many countries. Although telemedicine has some important limitations, I believe its advantages outweigh its disadvantages when it is used for the right patients.\n\nThe first advantage is improved access. Patients who live in rural areas or on islands no longer need to travel for hours to see a specialist, and people with disabilities can consult a doctor from home. Secondly, telemedicine saves time and money for both patients and hospitals. A short follow-up for a stable condition such as hypertension or diabetes can be completed in ten minutes without crowded waiting rooms, which also reduces the spread of infections. In addition, patients can easily send photographs of rashes or wounds, which helps doctors to monitor healing between visits.\n\nHowever, there are clear disadvantages. A doctor cannot perform a physical examination through a screen, so serious signs, such as an abdominal mass or a heart murmur, may be missed. Furthermore, elderly patients and people with poor internet connections may struggle to use the technology. There are also concerns about the privacy of personal medical data.\n\nThese problems can be reduced with careful planning. Clinics can use video calls mainly for follow-up visits and ask patients with new or worrying symptoms to attend in person. Secure platforms and simple instructions can protect privacy and help older users.\n\nIn conclusion, telemedicine cannot completely replace face-to-face consultations. Nevertheless, by making care faster, cheaper and more accessible, it offers benefits that outweigh its drawbacks.", "checklist": ["서론 마지막 문장에 내 입장(thesis)이 분명하다", "본론 문단마다 주제문 + 근거 + 구체적 예시가 있다", "반대 의견을 인정하고 반박했다", "연결어를 다양하게 썼다 (However, Moreover, As a result ...)", "결론에서 입장을 다시 정리했다 (새 논점 없음)", "축약형·구어체 없이 격식체로 썼다", "250단어 이상"]}, {"type": "essay", "prompt": "Antibiotic resistance is a growing threat to global health. What are the main causes of this problem, and what measures can be taken to solve it?", "model": "Antibiotics have saved millions of lives, but bacteria are increasingly becoming resistant to them. If this trend continues, common infections and routine operations could become dangerous again. This essay will examine the main causes of antibiotic resistance and suggest some solutions.\n\nThe most important cause is the overuse of antibiotics in human medicine. Many patients expect antibiotics for colds and sore throats, even though these are usually caused by viruses, and some doctors prescribe them to satisfy patients. In several countries, antibiotics can also be bought at pharmacies without a prescription. A second cause is poor adherence: patients often stop taking their tablets as soon as they feel better. Finally, large amounts of antibiotics are used in farming to make animals grow faster, and resistant bacteria can then spread to humans.\n\nSeveral measures can address these problems. Governments should strictly enforce laws that prevent pharmacies from selling antibiotics without a prescription. Hospitals can introduce antibiotic stewardship programmes, in which specialists review prescriptions and doctors follow clear guidelines. Public education campaigns should explain that antibiotics do not work against viruses and that patients must follow their doctor's instructions. In addition, the use of antibiotics to promote growth in animals should be banned, as it already is in the European Union. Research into new antibiotics and rapid diagnostic tests should also be funded, since very few new classes of antibiotics have been discovered in recent decades.\n\nIn conclusion, antibiotic resistance is mainly caused by unnecessary use in people and animals. Only a combination of stricter regulation, better prescribing and public education can protect these essential medicines for future generations.", "checklist": ["서론 마지막 문장에 내 입장(thesis)이 분명하다", "본론 문단마다 주제문 + 근거 + 구체적 예시가 있다", "반대 의견을 인정하고 반박했다", "연결어를 다양하게 썼다 (However, Moreover, As a result ...)", "결론에서 입장을 다시 정리했다 (새 논점 없음)", "축약형·구어체 없이 격식체로 썼다", "250단어 이상"]}]}, {"id": "u10", "title": "Speaking Lab", "title_ko": "말하기 실전 — 자기소개·2분 스피치", "vocab": [{"term": "That's an interesting question. Let me think for a moment.", "ko": "좋은 질문이네요. 잠시 생각해 볼게요.", "lay": "buying time", "example": "That's an interesting question. Let me think for a moment."}, {"term": "Could you repeat the question, please?", "ko": "질문을 다시 말씀해 주시겠어요?", "lay": "asking for repetition", "example": "Sorry, could you repeat the question, please?"}, {"term": "There are two main reasons ...", "ko": "주된 이유는 두 가지입니다", "lay": "signposting", "example": "There are two main reasons why I want to work in Vietnam."}, {"term": "First, ... Second, ... Finally, ...", "ko": "첫째, 둘째, 마지막으로", "lay": "ordering points", "example": "First, I would listen. Second, I would apologise."}, {"term": "From my clinical experience, ...", "ko": "제 임상 경험으로는", "lay": "giving an example", "example": "From my clinical experience, most patients accept this advice."}, {"term": "It depends on ...", "ko": "~에 따라 다릅니다", "lay": "nuanced answer", "example": "It depends on whether the patient has capacity."}, {"term": "I see your point, but ...", "ko": "말씀은 이해하지만", "lay": "polite disagreement", "example": "I see your point, but honesty usually builds more trust."}, {"term": "What I mean is ...", "ko": "제 말은", "lay": "clarifying", "example": "What I mean is that consent is a process, not a form."}, {"term": "To sum up, ...", "ko": "요약하면", "lay": "concluding", "example": "To sum up, truth-telling should be the rule."}, {"term": "I'm not completely sure, but I think ...", "ko": "확실하진 않지만 제 생각엔", "lay": "honest uncertainty", "example": "I'm not completely sure, but I think the law requires reporting."}], "exercises": [{"type": "speech", "kind": "intro", "topic": "Self-introduction", "prompt": "Could you introduce yourself, please?", "prep": 0, "time": 90, "outline": ["이름·국적·전공", "학력·면허·경력 연수", "현재 근무지와 하는 일", "개인적인 한 줄 (가족, 취미, 베트남 생활)"], "model": "Good morning. My name is [full name], and I am a doctor from South Korea. I graduated from [university] College of Medicine in [year], and after my internship and residency I became a board-certified specialist in [specialty].\n\nI have been practising medicine for [number] years. Before coming to Vietnam, I worked at [hospital] in [city], where I mainly treated patients with [common conditions]. Now I work at [clinic or hospital] in Ho Chi Minh City. My patients include Korean residents, Vietnamese families and other foreigners, so I use English every day, together with some basic Vietnamese.\n\nOutside work, I enjoy [hobby], and I am trying to improve my Vietnamese by talking with my colleagues and neighbours. I really like living here, especially the friendly people and the food.\n\nThank you. I am happy to answer any questions.", "followups": [{"q": "Why did you choose your specialty?", "a": "I chose [specialty] because I enjoy [reason, e.g. building long-term relationships with patients / solving diagnostic problems], and I can see the results of my care clearly."}, {"q": "What is a typical working day like for you?", "a": "I usually see about [number] patients a day. Most of them come with [common problems], and I also spend time explaining test results and giving lifestyle advice."}, {"q": "How long have you been in Vietnam?", "a": "I have been living in Ho Chi Minh City for [number] years. At first the traffic and the heat were difficult, but now I feel at home."}, {"q": "What do you find most difficult about working here?", "a": "The biggest challenge is language. Even when I understand the medical problem, I need to make sure the patient fully understands my explanation, so I speak slowly and check their understanding."}]}, {"type": "speech", "kind": "intro", "topic": "Motivation", "prompt": "Why do you want to practise medicine in Vietnam, and why are you taking this exam?", "prep": 0, "time": 90, "outline": ["베트남에서 진료하려는 이유 (환자층, 개인적 계기)", "이 시험의 의미 (법적 요건 + 환자 안전)", "앞으로의 계획 (언어 학습, 기여)"], "model": "There are two main reasons why I want to practise medicine in Vietnam.\n\nFirst, there is a large Korean community in Ho Chi Minh City, and many Korean patients feel more comfortable when they can see a doctor who understands their language and culture. At the same time, I meet many Vietnamese and international patients, and I want to provide the same high standard of care to all of them.\n\nSecond, I am personally attached to this country. [Personal reason, e.g. my family moved here for work / I first came here as a volunteer.] I would like to build my career here for the long term.\n\nI am taking this exam because Vietnamese law requires foreign doctors to show that they can communicate safely with patients. I think this rule is fair. Good communication is not only a legal requirement but also a matter of patient safety. If a patient misunderstands how to take a medicine, the result can be serious.\n\nIn the future, I plan to keep improving my English and Vietnamese, and to share my experience with Vietnamese colleagues.", "followups": [{"q": "What challenges do you expect as a foreign doctor here?", "a": "I expect differences in the health system, such as insurance rules and referral pathways, and of course language. I plan to learn from local colleagues and ask when I am not sure."}, {"q": "What are the main differences between the Korean and Vietnamese health systems?", "a": "In Korea almost everyone uses national health insurance and patients can go directly to large hospitals. In Vietnam, health insurance coverage is also high, but patients are expected to follow a referral system, and there is a big difference between urban and rural services."}, {"q": "How do you keep your medical knowledge up to date?", "a": "I read guidelines and journals, attend online conferences, and discuss difficult cases with colleagues. I also complete continuing medical education every year."}, {"q": "If you pass, what will you do differently?", "a": "I will be able to work with full confidence, and I want to spend more time on patient education, which I think is the most effective part of medicine."}]}, {"type": "speech", "kind": "topic", "topic": "Truth-telling", "prompt": "Should doctors always tell patients the truth about their illness?", "prep": 60, "time": 120, "outline": ["입장: 진실 고지가 원칙, 단 방법·속도가 중요", "근거 1: 자기결정권·동의", "근거 2: 신뢰", "반론: 가족의 은폐 요청(아시아 문화) → 얼마나 알고 싶은지 묻기", "결론"], "model": "I believe that doctors should tell patients the truth, but how and when we tell it matters as much as what we say.\n\nFirst, patients have a right to information about their own health. Without the truth, they cannot give informed consent to treatment or make important decisions about their work, their money and their families.\n\nSecond, honesty builds trust. If a patient later discovers that the doctor hid a diagnosis, they may stop trusting not only that doctor but the whole health system.\n\nHowever, I understand why some families, both in Vietnam and in Korea, ask doctors to hide a cancer diagnosis from an elderly parent. They want to protect their loved one from fear. In that situation, I would not lie to the patient, but I would not force information on them either. I would ask the patient how much they want to know and whether they would like a family member to be present. Then I would give the information step by step, in simple words, and check their understanding.\n\nIn conclusion, truth-telling should be the rule, but it must be done with compassion, at the patient's pace and with proper support.", "followups": [{"q": "What would you do if the family insists that you must not tell the patient?", "a": "I would listen to their worries and explain that the patient has a right to know. I would then agree on a plan, for example asking the patient together how much they want to be told."}, {"q": "Is it ever acceptable to delay giving bad news?", "a": "Yes, for a short time, for example if the patient is acutely confused or has just come out of surgery. But it should be a delay, not a decision never to tell."}, {"q": "How do you keep hope when the news is bad?", "a": "I focus on what can still be done, such as controlling pain and other symptoms, and I make it clear that the team will not abandon the patient."}]}, {"type": "speech", "kind": "topic", "topic": "Informed consent", "prompt": "What is informed consent, and why is it important?", "prep": 60, "time": 120, "outline": ["정의: 이해 + 자발적 동의 (서명 자체가 아님)", "요소: 판단능력, 정보(목적·이익·위험·대안·무치료), 자발성", "중요성: 자율성, 법, 신뢰", "실천: 쉬운 말, 통역, teach-back", "예외: 응급"], "model": "Informed consent means that a patient voluntarily agrees to a test or treatment after understanding what it involves. It is a process of communication, not just a signature on a form.\n\nThere are three key elements. First, the patient must have the capacity to make the decision. Second, they need enough information: the purpose of the procedure, the expected benefits, the common and serious risks, the alternatives, and what may happen if they choose no treatment. Third, the decision must be voluntary, without pressure from the doctor or the family.\n\nInformed consent is important for several reasons. Ethically, it respects the patient's autonomy. Legally, treating a patient without valid consent can be considered assault. And practically, patients who understand their treatment are more likely to follow the plan.\n\nIn my practice, I use plain language, draw simple diagrams, and use a professional interpreter when necessary. I also ask the patient to explain the plan back to me in their own words. This is called the teach-back method.\n\nThe main exception is an emergency. If an unconscious patient needs urgent treatment and no representative is available, the doctor should act in the patient's best interests.", "followups": [{"q": "What if the patient does not have capacity?", "a": "Then a legal representative, usually a close family member, makes the decision, and the doctor must act in the patient's best interests."}, {"q": "Can a patient refuse life-saving treatment?", "a": "An adult with capacity can refuse, even if I disagree. I would explore the reasons, make sure they understand the consequences, document the discussion, and tell them they can change their mind."}, {"q": "Who should obtain consent?", "a": "Ideally the doctor performing the procedure, or someone who knows it well enough to explain the risks and answer questions."}]}, {"type": "speech", "kind": "topic", "topic": "Confidentiality", "prompt": "When, if ever, can a doctor break patient confidentiality?", "prep": 60, "time": 120, "outline": ["원칙: 비밀유지 = 신뢰의 기반", "예외 1: 환자 동의", "예외 2: 법적 의무 (신고 감염병, 법원 명령)", "예외 3: 타인에게 심각한 위해 위험", "방법: 최소한만, 가능하면 환자에게 알림"], "model": "Confidentiality is one of the foundations of medicine. Patients tell us very personal information because they trust that we will keep it private. If they lose that trust, they may hide important symptoms, which can be dangerous.\n\nHowever, confidentiality is not absolute. There are a few situations in which a doctor may share information.\n\nThe first is when the patient gives consent, for example to talk to a family member or to send a report to an employer.\n\nThe second is when the law requires it. Certain infectious diseases, such as tuberculosis, must be reported to the public health authorities, and a court can order the release of medical records.\n\nThe third is when there is a serious risk of harm to other people. For example, if a patient tells me that he plans to hurt someone, I may need to inform the appropriate authorities.\n\nEven in these cases, I would share only the minimum information that is necessary, and whenever possible I would tell the patient first what I am going to disclose and why.\n\nIn summary, confidentiality should be protected in almost all situations, and any exception must be justified, limited and documented.", "followups": [{"q": "A relative phones and asks about a patient's condition. What do you do?", "a": "I would not give details over the phone until I have checked that the patient agrees and that I am speaking to the right person."}, {"q": "A patient with HIV refuses to tell his partner. What would you do?", "a": "I would explain the risk to the partner and strongly encourage him to disclose, offering help to do so. If he still refuses, I would follow local law and hospital guidance and seek senior advice."}, {"q": "Can you discuss a case with colleagues?", "a": "Yes, with colleagues involved in the patient's care, or for teaching if the patient cannot be identified."}]}, {"type": "speech", "kind": "topic", "topic": "Breaking bad news", "prompt": "How should a doctor break bad news to a patient?", "prep": 60, "time": 120, "outline": ["SPIKES 구조로 설명", "Setting: 조용한 공간, 시간 확보, 보호자", "Perception·Invitation: 무엇을 알고 있는지, 얼마나 알고 싶은지", "Knowledge: 경고 문장, 쉬운 말, 조금씩", "Emotions·Strategy: 공감, 침묵, 계획과 요약"], "model": "Breaking bad news is one of the hardest tasks in medicine, but it is a skill that can be learned. Many doctors use a framework called SPIKES.\n\nFirst, the setting. I would find a quiet, private room, switch off my phone, sit down, and ask whether the patient would like a family member to be present.\n\nNext, perception and invitation. I would ask what the patient already understands about their illness and how much detail they want to know. This tells me where to start.\n\nThen I give the knowledge. I start with a warning shot such as, 'I'm afraid the results are not what we hoped.' Then I explain the news in small pieces, without medical jargon, and I pause often.\n\nAfter that, I respond to emotions. Patients may cry, become angry or go silent. I allow silence, offer a tissue, and acknowledge their feelings, for example, 'I can see this is a terrible shock.'\n\nFinally, strategy and summary. I explain the next steps, answer questions, and arrange a follow-up appointment, because most patients remember very little after hearing bad news.\n\nDone well, this approach helps patients feel respected and supported, even on the worst day of their lives.", "followups": [{"q": "What do you do if the patient starts crying?", "a": "I stop talking, give them time, offer a tissue and say something like, 'Take your time.' I continue only when they are ready."}, {"q": "Should you break bad news over the phone?", "a": "It is better face to face. If it must be by phone, I would make sure the patient is in a safe place and not alone, and arrange to see them soon."}, {"q": "How do you avoid destroying hope?", "a": "I am honest about the prognosis but I emphasise what we can do, such as treatment options, symptom control and support."}]}, {"type": "speech", "kind": "topic", "topic": "An angry relative", "prompt": "How would you deal with an angry relative who has been waiting for many hours?", "prep": 60, "time": 120, "outline": ["안전·조용한 장소", "끊지 말고 듣기", "감정 인정 + 경험에 대한 사과", "지연 이유 설명 + 구체적 계획", "필요 시 상급자·민원 절차"], "model": "When a relative is angry, my first aim is to calm the situation and keep everyone safe.\n\nI would introduce myself, invite the relative to a quieter place, and sit down at the same level. Then I would listen without interrupting. Very often, anger comes from fear and from feeling ignored.\n\nNext, I would acknowledge their feelings. For example, 'I can see you're very worried about your father, and waiting for six hours must be exhausting.' I would also apologise for their experience. Saying sorry for the long wait does not mean admitting that someone was negligent.\n\nThen I would explain honestly why there was a delay, for instance several emergency cases arriving at the same time, and give a clear plan: who will see the patient, roughly when, and what tests are needed. Vague promises usually make people angrier.\n\nIf the relative still wants to complain, I would explain how to use the hospital's complaint process and inform my senior.\n\nFinally, if a person becomes aggressive or threatening, staff safety comes first, and I would call security.\n\nIn my experience, most angry people calm down when they feel that someone is genuinely listening.", "followups": [{"q": "What if the delay was caused by a mistake?", "a": "I would be honest, apologise sincerely, explain what we are doing to correct it, and report it through the incident system."}, {"q": "What if the relative is shouting at a junior nurse?", "a": "I would step in politely, take over the conversation, and later check that the nurse is all right."}, {"q": "How do you control your own emotions?", "a": "I remind myself that the anger is usually not personal, I keep my voice calm and slow, and I take a short break afterwards if needed."}]}, {"type": "speech", "kind": "topic", "topic": "Medical errors", "prompt": "Should doctors tell patients when a medical error has happened?", "prep": 60, "time": 120, "outline": ["입장: 예 — 정직 의무(duty of candour)", "단계 1: 환자 안전 먼저", "단계 2: 신속·사실대로·진심 어린 사과", "단계 3: 대책 설명 + 사고 보고 (처벌 아닌 학습)", "효과: 신뢰, 오히려 분쟁 감소"], "model": "Yes. I strongly believe that doctors have a duty to tell patients when an error has caused, or could cause, harm. This is often called the duty of candour.\n\nWhen an error happens, the first step is to make sure the patient is safe and to treat any harm. For example, if a patient received the wrong dose of a drug, I would assess them immediately and start monitoring.\n\nThe second step is to tell the patient, and their family if appropriate, as soon as possible. I would explain what happened in plain language, what the consequences might be, and offer a sincere apology.\n\nThe third step is to explain what we are doing to prevent it from happening again, and to report the incident through the hospital system. Good reporting systems focus on learning, not blaming, because most errors are caused by system problems such as similar drug names or poor handover.\n\nSome doctors are afraid that being honest will lead to lawsuits. However, studies suggest that patients are more likely to complain when they feel that information has been hidden.\n\nIn conclusion, honesty after an error is the right thing to do ethically, and it also protects trust in the profession.", "followups": [{"q": "Does apologising mean admitting legal liability?", "a": "No. An apology expresses regret for what happened. Many countries now encourage apologies for this reason."}, {"q": "What should you do about a near miss that caused no harm?", "a": "I would still report it, because near misses show us weaknesses in the system before a patient is harmed."}, {"q": "What if you see a colleague make a mistake?", "a": "I would first talk to the colleague privately. If the patient has been harmed or the colleague will not act, I would inform a senior doctor."}]}, {"type": "speech", "kind": "topic", "topic": "Gifts", "prompt": "Should doctors accept gifts from patients or pharmaceutical companies?", "prep": 60, "time": 120, "outline": ["환자 선물: 치료 후 작은 감사 표시는 허용 가능(문화)", "불가: 현금·고가·치료 전 봉투", "제약사 선물: 처방에 영향 → 원칙적으로 거절", "병원 규정 준수·신고", "결론"], "model": "I think we need to distinguish between small gifts from patients and gifts from pharmaceutical companies.\n\nIn both Vietnam and Korea, patients often want to thank their doctor, for example with fruit, a card or a small cake after treatment. Refusing such a gift can seem rude, so I think it is acceptable, as long as it is small and given after care has been provided.\n\nHowever, money, expensive gifts, or envelopes given before treatment are different. They may influence a doctor's judgement, or create the impression that patients must pay extra to receive good care. This is unfair to poorer patients, so I would politely refuse.\n\nGifts from pharmaceutical companies are a bigger concern. Research has shown that even small gifts, such as meals or pens, can influence prescribing. Doctors should therefore choose medicines based on evidence and cost, not on relationships with companies.\n\nIn practice, I follow my hospital's policy, declare anything I receive, and ask myself one simple question: 'Would I be comfortable if my patients knew about this?'\n\nIn conclusion, small thank-you gifts are acceptable, but anything that could affect our objectivity should be refused.", "followups": [{"q": "A patient insists on giving you an envelope of money. What do you say?", "a": "I would thank them warmly but refuse, explaining that every patient receives the same care. If they still want to help, I could suggest a donation to a hospital charity fund."}, {"q": "Is it acceptable to attend a conference paid for by a drug company?", "a": "It may be acceptable if the content is educational, the arrangement is transparent and approved by the hospital, and I declare the conflict of interest."}, {"q": "Why can small gifts be a problem?", "a": "Because they create a feeling of obligation, often without the doctor noticing it."}]}, {"type": "speech", "kind": "topic", "topic": "Language barriers", "prompt": "How can doctors communicate effectively with patients who speak a different language?", "prep": 60, "time": 120, "outline": ["전문 통역 사용 (가족·아이 통역 피하기)", "통역사가 아닌 환자를 보고 말하기", "짧은 문장, 전문용어 피하기, 그림", "teach-back으로 이해 확인", "베트남어 기본 표현 학습 — 신뢰"], "model": "This topic is very important to me, because as a Korean doctor in Vietnam, I face language barriers every day.\n\nThe most important step is to use a professional medical interpreter whenever the conversation is important, such as when taking consent or explaining a diagnosis. Family members, and especially children, should not be used for sensitive topics, because they may change the message, leave out information, or feel uncomfortable.\n\nWhen I work with an interpreter, I look at the patient, not the interpreter, and I speak in short sentences. I avoid medical jargon and idioms that are hard to translate.\n\nVisual aids are also very useful. I often draw a simple picture of the organ involved or show the medicine packet.\n\nTo check understanding, I use the teach-back method. I ask the patient, 'Can you tell me how you will take this medicine?' rather than 'Do you understand?', because many patients say yes just to be polite.\n\nFinally, I try to learn basic Vietnamese greetings and phrases. Even a few words show respect and help patients to relax.\n\nGood communication across languages takes more time, but it prevents errors and makes patients feel respected.", "followups": [{"q": "What if no interpreter is available in an emergency?", "a": "I would use a telephone or video interpreting service if possible, keep to essential information, use gestures and pictures, and arrange a proper interpreter as soon as I can."}, {"q": "Why shouldn't children interpret for their parents?", "a": "It puts a heavy emotional burden on the child, they may not know medical words, and the parent may not share private information."}, {"q": "How are y
